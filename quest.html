<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- global.js expects mapboxgl to exist, even on pages without a map -->
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>

<link rel="icon" href="icon3.png" type="image/x-icon" />
<link rel="shortcut icon" href="icon3.png" type="image/x-icon" />
<link rel="stylesheet" href="all_styles.css">

<title>Quest</title>

<style>
  body { overflow-y: auto; }

  #container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.4vmin;
    padding: 1vmin 2vmin 4vmin;
  }

  #quest-container {
    width: 100%;
    max-width: 680px;
  }

  /* -------- PERSISTENT HUD (timer + score) -------- */
  .quest-hud {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vmin;
    flex-wrap: wrap;
  }

  .quest-hud-item {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: clamp(15px, 2.4vmin, 22px);
    letter-spacing: 0.04em;
    color: var(--heading-ink);

    padding: 0.7vmin 2.2vmin;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: rgba(255, 248, 230, 0.72);
    box-shadow: var(--shadow-tight);
    transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }

  #round-timer-item.low {
    color: var(--incorrect-color);
    border-color: rgba(140, 40, 40, 0.45);
    background: rgba(140, 40, 40, 0.08);
    animation: questPulse 1s ease-in-out infinite;
  }

  @keyframes questPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* -------- END SCREEN -------- */
  .quest-end {
    text-align: center;
    padding: 4vmin 3vmin;
  }

  .quest-end-title {
    font-family: var(--font-ui);
    font-size: clamp(26px, 5vmin, 48px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--heading-ink);
  }

  .quest-end-score {
    margin: 1.4vmin 0 2.6vmin;
    font-family: var(--font-display);
    font-size: clamp(18px, 2.8vmin, 26px);
    color: var(--ink);
  }

  .quest-end-score strong {
    color: var(--correct-color);
    font-size: 1.25em;
  }

  .quest-end-stars {
    font-size: clamp(28px, 5vmin, 52px);
    letter-spacing: 0.12em;
    color: #c99a3c;
    text-shadow: 0 2px 6px rgba(120, 80, 20, 0.35);
    margin: 1vmin 0 0.4vmin;
    animation: starsPop 0.6s cubic-bezier(.2,1.4,.4,1) both;
  }

  .quest-end-blurb {
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(14px, 2vmin, 19px);
    color: var(--ink-soft);
    margin-bottom: 2.4vmin;
  }

  .quest-end.celebrate {
    animation: celebratePop 0.6s cubic-bezier(.2,1.3,.4,1) both;
    box-shadow:
      0 0 0 2px rgba(201, 154, 60, 0.4),
      0 18px 44px rgba(0,0,0,0.22),
      0 0 40px rgba(201, 154, 60, 0.22);
  }

  @keyframes starsPop {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes celebratePop {
    0% { transform: scale(0.94); opacity: 0; }
    60% { transform: scale(1.02); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* -------- CONFETTI -------- */
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 99999;
  }

  .confetti-piece {
    position: absolute;
    top: -5vh;
    border-radius: 1px;
    opacity: 0.95;
    animation-name: confettiFall;
    animation-timing-function: ease-in;
    animation-iteration-count: 1;
  }

  @keyframes confettiFall {
    0% { transform: translate(0, -10vh) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--drift, 0), 110vh) rotate(var(--spin, 360deg)); opacity: 0.9; }
  }

  /* -------- QUEST CARD -------- */
  .quest-card {
    width: 100%;
    padding: 3vmin 3.2vmin;
    text-align: center;
  }

  .quest-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1vmin;
    margin-bottom: 1.6vmin;
  }

  .quest-badge {
    font-family: var(--font-ui);
    font-size: clamp(11px, 1.5vmin, 14px);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--classy-blue-ink);
    background: var(--plum-wash);
    border: 1px solid rgba(106, 47, 82, 0.25);
    border-radius: 999px;
    padding: 0.4vmin 1.4vmin;
  }

  .quest-timer {
    font-family: var(--font-ui);
    font-size: clamp(13px, 1.9vmin, 18px);
    font-weight: 700;
    color: var(--heading-ink);
  }

  .quest-text {
    font-family: var(--font-display);
    font-size: clamp(20px, 3.4vmin, 32px);
    line-height: 1.3;
    color: var(--ink);
    margin: 0.5vmin 0 2.4vmin;
  }

  /* -------- ANSWER ROW -------- */
  .quest-answer-row {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 1.2vmin;
    flex-wrap: wrap;
  }

  .quest-typeahead {
    position: relative;
    flex: 1 1 280px;
    max-width: 360px;
    text-align: left;
  }

  .quest-input {
    width: 100%;
    margin: 0;
  }

  .quest-select {
    flex: 1 1 220px;
    max-width: 280px;
    padding: 1vmin 1.2vmin;
    border: 1px solid rgba(139,115,85,0.35);
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.75);
    color: var(--input-ink);
    font-family: var(--font-body);
    font-size: clamp(14px, 2vmin, 18px);
    box-shadow: inset 0 1px 6px rgba(0,0,0,0.08);
    outline: none;
    cursor: pointer;
  }

  .quest-select:focus {
    border-color: var(--classy-blue-ink);
    box-shadow: inset 0 1px 6px rgba(0,0,0,0.08), 0 0 0 3px var(--plum-wash);
  }

  .quest-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 50;
    margin: 0;
    padding: 0;
    list-style: none;
    max-height: 34vh;
    overflow-y: auto;
    display: none;

    background: var(--paper);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-soft);
  }

  .quest-results li {
    padding: 1vmin 1.4vmin;
    cursor: pointer;
    font-size: clamp(13px, 1.9vmin, 17px);
    color: var(--ink);
    border-top: 1px solid var(--rule-faint);
  }

  .quest-results li:first-child { border-top: 0; }

  .quest-results li:hover {
    background: var(--accent-wash);
    color: var(--classy-blue-ink);
  }

  .quest-check {
    min-width: 16vmin;
    min-height: auto;
    padding: 1vmin 2.4vmin;
    font-size: clamp(13px, 2vmin, 18px);
  }

  .quest-check:disabled {
    opacity: 0.5;
    cursor: default;
    pointer-events: none;
  }

  /* -------- FEEDBACK -------- */
  .quest-feedback {
    min-height: 1.6em;
    margin-top: 1.8vmin;
    font-family: var(--font-ui);
    font-size: clamp(14px, 2vmin, 19px);
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .quest-feedback.correct { color: var(--correct-color); }
  .quest-feedback.wrong { color: var(--incorrect-color); }
  .quest-feedback.warn { color: var(--ink-soft); font-weight: 400; font-style: italic; }

  .quest-solved {
    font-family: var(--font-body);
    font-weight: 400;
    font-style: italic;
    color: var(--ink-soft);
    margin-left: 0.6vmin;
  }

  /* -------- NEXT BUTTON -------- */
  #next-btn {
    min-width: 22vmin;
    min-height: auto;
    padding: 1.2vmin 3vmin;
    font-size: clamp(14px, 2.1vmin, 19px);
  }

  /* -------- EXPLORER LINKS -------- */
  .quest-explore {
    width: 100%;
    max-width: 680px;
    margin-top: 1vmin;
    text-align: center;
  }

  .quest-explore-title {
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(13px, 1.8vmin, 17px);
    color: var(--ink-soft);
    margin-bottom: 1.2vmin;
  }

  .quest-explore-links {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.4vmin;
  }

  .quest-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5vmin;

    padding: 1.4vmin 1vmin;
    text-decoration: none;
    color: var(--heading-ink);

    border: 1px solid var(--rule);
    border-radius: var(--radius);
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.4), transparent 50%),
      rgba(255, 248, 230, 0.6);
    box-shadow: var(--shadow-tight);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .quest-link:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-soft);
    border-color: var(--rule-strong);
  }

  .quest-link .ql-icon {
    font-size: clamp(24px, 4.4vmin, 40px);
    line-height: 1;
    filter: sepia(0.35);
  }

  .quest-link .ql-label {
    font-family: var(--font-ui);
    font-size: clamp(12px, 1.7vmin, 16px);
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  @media (max-width: 560px) {
    .quest-explore-links { grid-template-columns: repeat(2, 1fr); }
    .quest-answer-row { flex-direction: column; align-items: stretch; }
    .quest-typeahead, .quest-select { max-width: none; }
  }
</style>
</head>

<body>

  <div class="alert-box" id="customAlert">
    <p id="message"></p>
    <button id="exit-button" type="button"
      onclick="document.getElementById('customAlert').style.display='none'">×</button>
  </div>

  <div class="header-section">
    <div class="header">
      <h1>
        <span class="emoji">🏹</span>
        <span class="gradient-text">Quest</span>
      </h1>
      <p class="subtitle">Answer the call — name the sage, the city, or the year.</p>
      <button class="modern-button" id="home-button" onclick="window.location.href='index.html'">🏠</button>
      <button class="modern-button" id="info-button">ℹ️</button>
    </div>
  </div>

  <div id="container">
    <div class="quest-hud">
      <div class="quest-hud-item" id="round-timer-item">⏳ <span id="round-timer">3:00</span></div>
      <div class="quest-hud-item">🏅 Score: <span id="round-score">0</span></div>
    </div>

    <div id="quest-container"></div>

    <button class="cta-button sweep" id="next-btn">Next Quest</button>

    <div class="quest-explore">
      <div class="quest-explore-title">Stuck? Search for clues in the archives:</div>
      <div class="quest-explore-links">
        <a class="quest-link" href="time.html" target="_blank" rel="noopener">
          <span class="ql-icon">🕰️</span><span class="ql-label">Era</span>
        </a>
        <a class="quest-link" href="locate.html" target="_blank" rel="noopener">
          <span class="ql-icon">🧭</span><span class="ql-label">City</span>
        </a>
        <a class="quest-link" href="discover_select.html" target="_blank" rel="noopener">
          <span class="ql-icon">🔎</span><span class="ql-label">Sage</span>
        </a>
        <a class="quest-link" href="analyze.html" target="_blank" rel="noopener">
          <span class="ql-icon">⚖️</span><span class="ql-label">Analyze</span>
        </a>
      </div>
    </div>
  </div>

  <script src="global.js"></script>
  <script type="module" src="quest.js"></script>
</body>
</html>
