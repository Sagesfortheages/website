<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>

  <link rel="icon" href="icon3.png" type="image/x-icon" />
  <link rel="shortcut icon" href="icon3.png" type="image/x-icon" />

  <link rel="stylesheet" href="all_styles.css" />

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        linear-gradient(rgba(255,248,230,0.82), rgba(255,248,230,0.82)),
        url("https://zxddjxwfcypqoriatwvt.supabase.co/storage/v1/object/public/public_images/backgrounds/bg.webp") center/cover no-repeat;
      font-family: var(--font-body, Georgia, serif);
    }

    .reset-card{
      width:min(460px, 92vw);
      background: rgba(245,230,211,0.96);
      border: 1px solid rgba(139,115,85,0.35);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.28);
      padding: 24px;
    }

    .reset-title{
      margin: 0 0 8px;
      font-family: var(--font-ui, system-ui, sans-serif);
      font-size: clamp(1.3rem, 2.5vw, 1.7rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #3a2b22;
      text-align:center;
    }

    .reset-subtitle{
      margin: 0 0 18px;
      text-align:center;
      color: #5a4a3a;
      line-height: 1.4;
    }

    .reset-form{
      display:grid;
      gap:12px;
    }

    .reset-input{
      width:100%;
      padding:12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(139,115,85,0.35);
      background: rgba(255,255,255,0.8);
      font-size:16px;
      box-sizing:border-box;
    }

    .reset-button{
      border: 1px solid rgba(3,43,125,0.25);
      background: linear-gradient(
        to bottom,
        rgba(255,252,244,0.96),
        rgba(245,230,211,0.92)
      );
      color: rgb(3,43,125);
      font-family: var(--font-ui, system-ui, sans-serif);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 13px 16px;
      border-radius: 12px;
      cursor:pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
    }

    .reset-status{
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      display:none;
      font-weight:600;
      line-height:1.4;
    }

    .reset-status.success{
      display:block;
      background: rgba(70, 145, 90, 0.14);
      color: #245c33;
      border: 1px solid rgba(70, 145, 90, 0.28);
    }

    .reset-status.error{
      display:block;
      background: rgba(180, 60, 60, 0.12);
      color: #8a2222;
      border: 1px solid rgba(180, 60, 60, 0.25);
    }

    .back-link{
      display:block;
      margin-top:14px;
      text-align:center;
      color: rgb(3,43,125);
      font-weight:700;
    }
  </style>
</head>
<body>
  <div class="reset-card">
    <h1 class="reset-title">Choose New Password</h1>
    <p class="reset-subtitle">Enter your new password below.</p>

    <div class="reset-form">
      <input
        type="password"
        id="new-password"
        class="reset-input"
        placeholder="New password"
        autocomplete="new-password"
      />
      <input
        type="password"
        id="confirm-password"
        class="reset-input"
        placeholder="Confirm new password"
        autocomplete="new-password"
      />
      <button id="update-password-btn" class="reset-button" type="button">
        Update Password
      </button>
    </div>

    <div id="reset-status" class="reset-status"></div>

    <a class="back-link" href="index.html">Back to Home</a>
  </div>

  <script type="module">
    import { supabaseClient } from "./supabase/supabaseClient.js";

    const statusBox = document.getElementById("reset-status");
    const updateBtn = document.getElementById("update-password-btn");

    function showStatus(message, type){
      statusBox.textContent = message;
      statusBox.className = `reset-status ${type}`;
    }

    async function handlePasswordUpdate(){
      const newPassword = document.getElementById("new-password")?.value ?? "";
      const confirmPassword = document.getElementById("confirm-password")?.value ?? "";

      if (!newPassword || !confirmPassword){
        showStatus("Please fill out both password fields.", "error");
        return;
      }

      if (newPassword.length < 6){
        showStatus("Password must be at least 6 characters.", "error");
        return;
      }

      if (newPassword !== confirmPassword){
        showStatus("Passwords do not match.", "error");
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        password: newPassword
      });

      if (error){
        showStatus(error.message, "error");
        return;
      }

      showStatus("Password updated successfully. You can now log in with your new password.", "success");

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1800);
    }

    updateBtn?.addEventListener("click", handlePasswordUpdate);

    document.addEventListener("keydown", async (e) => {
      if (e.key === "Enter"){
        await handlePasswordUpdate();
      }
    });
  </script>
</body>
</html>
