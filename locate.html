<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locate</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css' rel='stylesheet' />
    <link rel="icon" href="icon3.png" type="image/x-icon">
    <link rel="shortcut icon" href="icon3.png" type="image/x-icon">
    <link rel="stylesheet" href="https://unpkg.com/intro.js/minified/introjs.min.css">
    <link rel="stylesheet" href="all_styles.css">
    <script src="https://unpkg.com/intro.js/minified/intro.min.js"></script>
    
    <style>




        .left-container {
            margin-left: 1vmin;
            margin-right: 1vmin;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .right-container {
            margin-left: 1vmin;
            margin-right: 1vmin;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .search-results {
            list-style: none;
            height: 33vmin;
        }

        .mapboxgl-marker.city {
            width: 24px;
            height: 24px;
            border-radius: 50%;

            /* Pigment fill instead of neon */
            background: radial-gradient(circle at 30% 30%, #f2e4c6 0%, #d9b77b 60%, #b38b4f 100%);

            /* Ink edge instead of bright border */
            border: 2px solid #6b4e2e;

            /* Subtle material shadow instead of glow */
            box-shadow:
                0 3px 6px rgba(0,0,0,0.25),
                inset 0 1px 0 rgba(255,255,255,0.4);

        }


        .mapboxgl-marker.city:hover {
            transform: scale(1.2);

            /* Slightly richer pigment */
            background: radial-gradient(circle at 30% 30%, #f7e9cd 0%, #e0c08a 60%, #c79c5a 100%);

            /* Slightly darker ink border */
            border-color: #5a3f22;

            box-shadow:
                0 6px 10px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.5);
        }


        .search-results li {
            padding: 0.5vmin 2vmin;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: 770;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 2vmin;
        }

        .search-results li:hover {
            background: rgba(74, 105, 189, 0.1);
        }

        /* Country List Container */


        .country-title {
            font-size: 3vmin;
            font-weight: 800;
            color: #333;
            margin-bottom: 1vmin;
            padding: 1.5vmin 2vmin 0;
            background: linear-gradient(120deg, #2c3e50, #4a69bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        #country-list {
            list-style: none;
            height: 33vmin;
            overflow-y: auto;
            padding: 0;
            margin: 0;
        }

        #country-list li {
            padding: 0.5vmin 2vmin;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: 770;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 2vmin;
        }

        #country-list li:hover {
            background: rgba(74, 105, 189, 0.1);
        }
        
        .selected{
            color: rgb(69, 69, 245);
            border-color: #1d4ed8;
            transform: scale(1.05);
            background: rgba(74, 105, 189, 0.1);
        }

        /* Info Card - styled like analyze containers */

        #occupant-list-content {
            list-style: none;
            height: 65vmin;
            overflow-y: auto;
            padding: 0;
            margin: 0;
        }

        #occupant-list-content li {
            padding: 0.5vmin 2vmin;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: 770;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 2vmin;
        }

        #occupant-list-content li:hover {
            background: rgba(74, 105, 189, 0.1);
        }

        /* Alert Box */
        .alert-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 3vmin;
            z-index: 10000;
            max-width: 80vw;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
        }

        #exit-button {
            position: absolute;
            top: 1.5vmin;
            right: 1.5vmin;
            width: 5vmin;
            height: 5vmin;
            border-radius: 50%;
            font-size: 2.5vmin;
            color: #666;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 770;
        }

        #exit-button:hover {
            background: #e0e0e0;
            transform: scale(1.1);
        }

        #message {
            font-size: 2.5vmin;
            line-height: 1.6;
            color: #333;
            font-weight: 500;
            margin-right: 3vmin;
        }



        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        li {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.6s forwards;
            }
            li:nth-child(1) { animation-delay: 0.04s; }
            li:nth-child(2) { animation-delay: 0.08s; }
            li:nth-child(3) { animation-delay: 0.12s; }
            li:nth-child(4) { animation-delay: 0.16s; }
            li:nth-child(5) { animation-delay: 0.20s; }
            li:nth-child(6) { animation-delay: 0.24s; }
            li:nth-child(7) { animation-delay: 0.28s; }
            li:nth-child(8) { animation-delay: 0.32s; }
            li:nth-child(9) { animation-delay: 0.36s; }
            li:nth-child(10) { animation-delay: 0.40s; }
            li:nth-child(11) { animation-delay: 0.44s; }
            li:nth-child(12) { animation-delay: 0.48s; }
            li:nth-child(13) { animation-delay: 0.52s; }
            li:nth-child(14) { animation-delay: 0.56s; }
            /* etc. */

            @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
@media (max-width: 768px) {
  html, body {
    height: 100%;
  }

  /* Header gets the top 20% */
  .header {
    height: 10vh;
    margin: 0;
    padding: 1vh 2vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Grid becomes:
     Row 1 (40vh): 3 equal columns (city / country / people)
     Row 2 (40vh): map spanning full width
  */
  .container-grid {
    height: 90vh;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 30vh 60vh;
    gap: 1vmin;
    padding: 1vmin;
  }

  /* Remove desktop margins/shadows that steal width */
  .left-container, .right-container {
    margin: 0;
    border-radius: 0;
    box-shadow: none;
  }

  /* Let children of left/right become grid items */
  .left-container { display: contents; }
  .right-container { display: contents; }

  /* City list = column 1 */

  /* Country list = column 2 */
  .country-container {
    grid-column: 2;
    grid-row: 1;
    height: 100%;
    overflow: hidden;
  }

  /* People list = column 3 */
  .info-card {
    grid-column: 3;
    grid-row: 1;
    height: 100%;
    overflow: hidden;
  }

  /* Make the list areas scroll internally */
  .search-results,
  #country-list,
  #occupant-list-content {
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Map spans ALL columns (full width) */
  .central-container {
    grid-column: 1 / -1;
    grid-row: 2;
    height: 100%;
    padding: 0;
  }

  #map {
    width: 100%;
    height: 100%;
    border-radius: 16px;
  }

}

    </style>
</head>
<body>
    <div class="alert-box" id="customAlert">
        <p id="message"></p>
        <button id='exit-button' onclick="hideCustomAlert(restart=false)">×</button>
    </div>
    <div class="header-section">
        <div class="header">
            <h1>
                <span class="emoji">🏙️</span> 
                <span class="gradient-text">Locate</span>
            </h1>
            <p class="subtitle">Explore which sages lived where and when by searching for cities or countries.</p>
            <button class="modern-button" id="home-button" onclick="window.location.href='index.html'">🏠</button>
            <button class="modern-button" id="info-button">ℹ️</button>
            <button class="modern-button second-right-button" id="feedback-button" 
            onclick="window.location.href='feedback.html'">📩</button>

        </div>
    </div>

    <div class="container-grid">
        <div class="left-container">
            <div class="panel search-container" id="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="🔍 Search by city">
                <ul class="search-results" id="search-results"></ul>
            </div>   


            <div class="panel search-container country-container" id="country-container">
                <input type="text" class="search-input" id="country-search" placeholder="🔍 Search by country">
                <ul class="country-list" id="country-list"></ul>
            </div>  
        </div>

        <div class="central-container">
            <div id="map"></div>  
        </div>  

        <div class="right-container">
            <div class="panel info-card" id="who-lived-there-list">
                <h3 class="panel-heading" id="occupant-list-heading">Who Lived There And When</h3>
                <ul id="occupant-list-content"></ul>
            </div>
        </div>
    </div>

    <div id="popup" class="popup">
        <span class="popup-message"></span>
    </div>

    <script>
        // Placeholder functions for compatibility
        function hideCustomAlert(restart = false) {
            document.getElementById('customAlert').style.display = 'none';
        }

        function showCustomAlert(message, fontSize = '2.5vmin', restart = false) {
            document.getElementById('message').innerHTML = message;
            document.getElementById('message').style.fontSize = fontSize;
            document.getElementById('customAlert').style.display = 'block';
        }
    </script>
</body>
<script src="global.js"></script>
<script type="module" src="locate.js"></script>
</html>
