    .gradient-text{
      font-size: var(--fs-sitename);
    }

    .inline-s{
      width: 1em;
      height: 1.1em;
      display: inline-block;
      vertical-align: -0.2em;
      margin: 0;

    .hero{
      position: relative;
      width: min(1534px, 100%);
      margin: 0 auto;

    /* Hero now participates in layout (no overlap with mega-strips) */
    .hero-image{
      position: relative; /* IMPORTANT: not absolute */
      width: 100%;
      height: 292px;

      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);

      background-image: url("https://zxddjxwfcypqoriatwvt.supabase.co/storage/v1/object/public/public_images/bg.webp");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
    }



    /* Overlay keeps your existing tagline/blurb/button ON the image */
    .hero-overlay{
      position: absolute;
      inset: 0;
      display: grid;
      place-items: start center;
      text-align: center;

      padding: 2vmin;
      pointer-events: none; /* lets clicks hit only the button we re-enable */
    }


    /* Optional: very subtle readability wash (doesn't change layout) */
    .hero-overlay::before{
      content:"";
      position:absolute;
      inset: 0;
      border-radius: 18px;
      background: linear-gradient(
        to bottom,
        rgba(255,248,230,0.22),
        rgba(255,248,230,0.06)
      );
      pointer-events:none;
    }

    /* Ensure overlay content sits above the wash */
    .hero-overlay > *{
      position: relative;
      z-index: 1;
    }

    .blurb{
      color: var(--classy-blue-ink);
      margin-top: -4vh;
      text-align: center;
      width: 30vw;
      margin-left: auto;
      margin-right: auto;
      font-size: var(--fs-subtitle-homepage);

    }

    .cta-button{
      display: block;
      margin: 1vh auto 0 auto;
      pointer-events: auto;
    }



    .hero-tagline{
      text-align:center;
      font-family: var(--font-ui);
      font-size: clamp(1.2rem, 2.2vw, 1.9rem);
      letter-spacing: 0.12em;
      margin-top: 0.4vh;
      margin-bottom: 1.2vh;
      color: rgba(47, 36, 27, 0.85);
      text-transform: uppercase;
      z-index: 1000000 !important;
      position:relative;
    }

    /* ======================================================
       🔒 AUTH OVERLAY — PARCHMENT THEME (MATCHES SITE)
       - fixed + high z-index
       - blocks all interaction behind it
       - does not affect layout
       ====================================================== */

    /* Fullscreen blocker */
    .overlay{
      position: fixed;
      inset: 0;
      display: none;                 /* toggled by JS */
      align-items: center;
      justify-content: center;
      z-index: 9999999;
      pointer-events: auto;
    }

    /* Backdrop */
    .overlay::before{
      content:"";
      position:absolute;
      inset: 0;  /* ink wash */
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Modal card */
    .auth-modal{
      position: relative;
      z-index: 1;

      width: min(420px, 92vw);
      border-radius: calc(var(--radius) + 6px);

      background: var(--paper-strong);
      border: 1px solid var(--rule-strong);
      box-shadow: 0 18px 50px rgba(0,0,0,0.35);

      padding: 2.2vmin 2.3vmin;
      overflow: hidden;
    }

    .auth-modal::after{
      content:"";
      position:absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45), transparent 55%);
      pointer-events:none;
      opacity: 0.75;
    }

    .auth-tabs{
      position: relative;
      z-index: 1;
      display:flex;
      gap: 1vmin;
      margin-bottom: 1.4vmin;
    }

    .auth-tab{
      flex: 1;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: rgba(255,255,255,0.55);
      color: var(--heading-ink);
      font-family: var(--font-ui);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.9vmin 1.2vmin;
      cursor: default;
    }

    .auth-tab.active{
      background: rgba(47,79,79,0.14);
      border-color: rgba(47,79,79,0.28);
      color: rgba(47,79,79,0.95);
    }

    .auth-form{
      position: relative;
      z-index: 1;
      display: grid;
      gap: 1vmin;
    }

    .auth-input{
      width: 100%;
      padding: 1.1vmin 1.2vmin;

      border-radius: var(--radius-sm);
      border: 1px solid rgba(139,115,85,0.35);
      background: rgba(255,255,255,0.75);

      font-family: var(--font-body);
      font-size: clamp(14px, 2.1vmin, 18px);
      color: var(--input-ink);

      box-shadow: inset 0 1px 6px rgba(0,0,0,0.08);
      outline: none;
    }

    .auth-input::placeholder{
      color: #7a6a5a;
      font-style: italic;
      opacity: 0.9;
    }

    .auth-actions{
      display:flex;
      gap: 1vmin;
      align-items:center;
      margin-top: 0.2vmin;
    }

    .auth-button{
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.8vmin;

      padding: 1.2vmin 1.6vmin;
      min-height: 6.6vmin;

      border-radius: calc(var(--radius) + 2px);
      border: 1px solid rgba(3,43,125,0.25);

      background: linear-gradient(
        to bottom,
        rgba(255, 252, 244, 0.96),
        rgba(245, 230, 211, 0.92)
      );
      color: var(--classy-blue-ink);

      font-family: var(--font-ui);
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: clamp(14px, 2.2vmin, 18px);

      box-shadow:
        0 10px 22px rgba(0,0,0,0.16),
        inset 0 1px 0 rgba(255,255,255,0.55);

      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .auth-button:hover{
      transform: translateY(-2px);
      box-shadow:
        0 14px 30px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.65);
      filter: saturate(1.03);
    }

    .auth-button:active{
      transform: translateY(0px);
      box-shadow:
        0 8px 16px rgba(0,0,0,0.16),
        inset 0 2px 10px rgba(0,0,0,0.10);
    }

    .hidden{ display:none; }

    /* Auth status toast (kept, but parchment-friendly) */
    .auth-status{
      position: fixed;
      top: 2vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000000;

      padding: 1vmin 1.6vmin;
      border-radius: 999px;

      font-family: var(--font-ui);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;

      font-size: clamp(12px, 1.8vmin, 15px);
      color: var(--paper);

      box-shadow: 0 10px 25px rgba(0,0,0,0.20);
    }
    .auth-status.success{ background: var(--correct-color); }
    .auth-status.error{ background: var(--incorrect-color); }

    /* Ensure overlay truly blocks clicking */
    body.overlay-open{
      overflow: hidden;
      touch-action: none;
    }

  <script type="module">
    import { supabaseClient } from "./supabase/supabaseClient.js";
    import { trackPageView } from "./supabase/supabaseFunctions.js";

    // Make available globally (your other pages/scripts may expect it)
    window.supabaseClient = supabaseClient;

    const overlay = document.getElementById("overlay");
    const loginForm = document.getElementById("login-form");
    const loginBtn = document.getElementById("login-button");

    function setOverlayVisible(visible){
      if (!overlay) return;
      overlay.style.display = visible ? "flex" : "none";
      document.body.classList.toggle("overlay-open", visible);
    }

    function showStatus(message, type = "success"){
      const bar = document.getElementById("auth-status");
      if (!bar) return;
      bar.textContent = message;
      bar.className = `auth-status ${type}`;
      bar.classList.remove("hidden");
      setTimeout(() => bar.classList.add("hidden"), 3500);
    }

    // Gatekeeper: show overlay if no session
    const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
    if (sessionError) console.error("getSession error:", sessionError);
    setOverlayVisible(!sessionData?.session);

    // Keep overlay synced with auth
    supabaseClient.auth.onAuthStateChange((_event, session) => {
      setOverlayVisible(!session);
    });

    // Login handler
    async function handleLogin(){
      const email = document.getElementById("login-email")?.value?.trim();
      const password = document.getElementById("login-password")?.value ?? "";

      if (!email || !password){
        showStatus("Enter email and password.", "error");
        return;
      }

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error){
        showStatus(error.message, "error");
        return;
      }

      showStatus("Login successful!");
      setOverlayVisible(false);
    }

    if (loginBtn){
      loginBtn.addEventListener("click", handleLogin);
    }

    // Enter submits ONLY when overlay is visible and focus is inside login form
    document.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      if (!overlay || overlay.style.display === "none") return;
      if (!loginForm || !loginForm.contains(document.activeElement)) return;
      await handleLogin();
    });

    // Page view (call once)
    try{
      await trackPageView();
    } catch (e){
      console.error("trackPageView failed:", e);
    }
