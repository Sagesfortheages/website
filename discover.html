<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css' rel='stylesheet' />
    <link rel="icon" href="icon3.png" type="image/x-icon">
    <link rel="shortcut icon" href="icon3.png" type="image/x-icon">
    <link rel="stylesheet" href="https://unpkg.com/intro.js/minified/introjs.min.css">
    <link rel="stylesheet" href="all_styles.css">
    <script src="https://unpkg.com/intro.js/minified/intro.min.js"></script>
    <style>

        .alert-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--paper);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            padding: 2rem;
            z-index: 1000;
            display: none;
            max-width: 80%;
            text-align: center;
        }

        .alert-box p {
            color: #333;
            margin-bottom: 1rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        #exit-button {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s ease;
        }

        #exit-button:hover {
            background-color: #f0f0f0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100vh - 4vmin);
            animation: bounceIn 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        .hero {
            background: var(--paper);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            position: relative;
            padding: 0.5vmin;
            height: 100%;
            overflow-y: auto;
            min-height: 0;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin:1vmin;
            gap: 1vmin;
        }

        #profile-pic {
            width: 20vmin;
            height: 20vmin;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .hero-content div {
            text-align: center;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            background: linear-gradient(120deg, #2c3e50, #4a69bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.15rem;
            color: #666;
            margin-bottom: 0.3rem;
        }

        .info-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 1vmin;
            height: calc(100% - 14.5vh);;
        }

        .left-column {
            display: grid;
            grid-template-rows: 4fr 2fr;
            gap: 1vmin;
        }

        .left-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1vmin;
            height:100%;
        }

        .right-column {
            display: grid;
            grid-template-rows: 1fr 4fr;
            gap: 1vmin;
            overflow: hidden;
            min-height: 0;
        }

        .left-column,
        .left-bottom,
        .hero,
        .info-card { min-height: 0; }

        .info-grid {
            display: contents;
        }

        .info-card {
            background: var(--paper);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 0.5vmin;
            transition: all 0.3s ease;
            overflow-y: auto;
            min-height: 0;
        }


        .info-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5vmin;
            display: inline;
        }

        .info-card .header-with-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.25vmin
        }

        .info-card .header-with-icon h3:first-child {
            margin-bottom: 0;
        }

        .info-card p {
            color: #555;
            line-height: 1.6;
            font-size: 1rem;
        }

        .info-card ul {
            list-style: none;
            padding: 0;
        }

        .info-card li {
            color: #555;
            margin-bottom: 0.5vmin;
            position: relative;
            padding-left: 0.5vmin
        }



        .clickable {
            color: var(--classy-blue-ink) !important;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .clickable:hover {
            color: rgb(13, 107, 201) !important;
        }

        #map {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            flex:1;
        }

        .map-container {
            background: var(--paper);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 0.5vmin;
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .map-header-controls {
            align-items: center;
            justify-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            flex-shrink: 0;
                        display: grid;
        }

        .map-header{
            display:flex
        }
    



        #course-nav {
            display: none;
            position: fixed;
            top: 90px;
            right: 20px;
            width: 180px;
            background: var(--paper);
            padding: 0.25vmin 1vmin;
            border-radius: 12px;
            border:#2c3e50 1px solid;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            text-align: center;
            z-index: 1000;
        }

        #progress-container {
            background: #e0e0e0;
            border-radius: 10px;
            height: 6px;
            width: 100%;
            margin-bottom: 0.5rem;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a69bd, #2c3e50);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .flex-buttons {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
        }

        #progress-label {
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.3rem;
            color: #2c3e50;
        }

        #prev-button, #next-button {
            flex: 1;
            padding: 0.25vmin 0.25vmin;
            font-size: 0.85rem;
            border-radius: 10px;
            border: none;
            background: var(--classy-blue-ink);
            color: var(--paper);
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
        }

        #prev-button:hover, #next-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
        }



        #map-container {
            position: relative;
        }

        .map-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.65);
            color: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none; /* allows map to be visually covered but not interactive */
        }

        .hidden {
            display: none;
        }



        .map-control-slot{
  height: 8vh;              /* choose a consistent height */
  width: min(700px, 90%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
}

#assignment-cta {
    position: fixed;
    top: 90px;
    right: 20px;
    z-index: 1000;
    width: auto;
    height: auto;
    border-radius: 1vmin;
    padding: 0.25vmin;
}

/* the text box that temporarily replaces it */
.play-status{
  width: 100%;
  height: 8vh;
  align-items: center;
  justify-content: center;

  text-align: center;

white-space: nowrap;
  text-overflow: ellipsis;
}

#play-status.hidden{
  display: none !important;
}

#play-button.hidden{
  display: none !important;
}



        @media (max-width: 768px) {
            body {
                padding: 2vmin;
                overflow-y: auto;
            }

            .subtitle {
                font-size: 6.5vmin;
            }

            .container {
                height: auto;
            }

            .info-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .left-column {
                grid-template-rows: auto auto;
            }

            .left-bottom {
                grid-template-columns: 1fr;
            }

            .right-column {
                grid-template-rows: auto auto;
            }

            .hero-content {
                flex-direction: column;
                text-align: center;
            }

            .hero h1 {
                font-size: 2rem;
            }

            #profile-pic {
                width: 20vmin;
                height: 20vmin;
            }
              .map-container {
                height: auto;       /* key change */
            }
            #map {
                height: 40vh !important;
                width: 100%;
                flex:none;
            }

            .play-status{
                width: 100%;
                height: 8vh;
                justify-content: center;

                text-align: top;

                white-space: wrap;
            }

            .map-header-controls {
            gap: 0;
            }
        }

        @media (max-width: 480px) {


            #course-nav {
                width: 100px;
                padding: 0.4rem 0.8rem;
            }

            #prev-button, #next-button {
                font-size: 0.8rem;
                padding: 0.4rem 0.6rem;
            }

            #progress-container {
                height: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="alert-box" id="customAlert">
        <p id="message"></p>
        <button id='exit-button' onclick="hideCustomAlert(restart=false)">×</button>
    </div>

    <div class="header-section">
        <div class="header">
            <h1>
                <span class="gradient-text" id="title-content"></span>
            </h1>
            <p class="subtitle" id="aka-content"></p>
        </div>
        <button class="modern-button" id="home-button" onclick="window.location.href='index.html'">🏠</button>
        <button class="modern-button" id="info-button">ℹ️</button>
        <button class="modern-button second-right-button" id="feedback-button" 
        onclick="window.location.href='feedback.html'">📩</button>
    </div>

    
    <div class="container">
        <div class="info-container">
            <section class="profile left-column">
                <div class="hero">
                    <div class="hero-content" id="hero-content">
                        <img id="profile-pic" alt="Picture Unavailable">
                        <div>
                            <p id="name-content"></p>
                            <p id="background-content"></p>
                            <p id="years-content" class="clickable">🕰️</p>
                            <p id="birthday-content">🎂</p>
                            <p id="yahrtzeit-content">🕯</p>
                            <p id="teachers-content">▲</p>
                            <p id="students-content">▼</p>
                            <!-- <a id="further-reading-link-text" target="_blank" class="clickable">Explore Further</a> -->
                        </div>
                    </div>
                </div>

                <div class="left-bottom">
                    <div class="info-card" id = "major-works" style="text-align: center;">
                        <div class="header-with-icon">
                            <h3>📚</h3>
                            <h3>Major Works</h3>
                        </div>
                        <ul id="major-works-list-content">
                        </ul>
                    </div>

                    <div class="info-card" id = "areas-of-focus" style="text-align: center;">
                        <div class="header-with-icon">
                            <h3>💡</h3>
                            <h3>Areas of Focus</h3>
                        </div>
                        <ul id="expertise-list-content">
                        </ul>
                    </div>
                </div>
            </section>

            <section class="right-column">
                <div class="bio info-card" id = "biography" style="text-align: center;">
                    <div class="header-with-icon">
                        <h3>📜</h3>
                        <h3>Biography</h3>
                    </div>
                    <p id="biography-content"></p>
                </div>
                
                <div class="map-container">
                    <div class="map-header-controls">
                        <div class="map-header">
                            <h3 >📍</h3>
                            <h3 id="places-heading">Places He Lived</h3>
                        </div>

                        <div class="map-control-slot">
                            <button class="round-sweep" id="play-button" type="button" aria-label="Play journey"></button>
                            <div id="play-status" class="play-status hidden" aria-live="polite"></div>
                        </div>
                    </div>

                    <div id="map">
                        <div id="map-overlay" class="map-overlay hidden">
                            Location history is not available for this sage.
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div id="popup" class="popup">
            <span class="popup-message"></span>
        </div>
    </div>

    <audio id="keyboard-sound" src="keyboard_sound.wav" preload="auto"></audio>


    <!-- Course navigation -->
    <div id="course-nav">
        <div id="progress-label">Progress: 0%</div>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div class="flex-buttons">
            <button id="prev-button">⬅ Previous</button>
            <button id="next-button">Next ➡</button>
        </div>
    </div>

    <script src="global.js"></script>
    <script type="module" src="discover.js"></script>
</body>
</html>
