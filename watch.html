<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.1/nouislider.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.1/nouislider.min.css" rel="stylesheet">
    <link rel="icon" href="icon3.png" type="image/x-icon">
    <link rel="shortcut icon" href="icon3.png" type="image/x-icon">
    <link rel="stylesheet" href="https://unpkg.com/intro.js/minified/introjs.min.css">
    <link rel="stylesheet" href="all_styles.css">
    <script src="https://unpkg.com/intro.js/minified/intro.min.js"></script>
    
    <style>

        

        .left-container {
            margin-left: 1vmin;
            margin-right: 1vmin;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .right-container {
            margin-left: 1vmin;
            margin-right: 1vmin;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* Legend Container - styled like analyze page */

        .legend-content {
            transition: opacity 0.3s ease;
        }


        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.25vh;
            font-weight: 770;
            padding: 0.5vmin;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 3vmin;
        }

        .legend-item:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
        }

        .color-box {
            width: 3vmin;
            height: 3vmin;
            border-radius: 50%;
            margin-right: 1vmin;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .item-label {
            font-size: 2.5vmin;
            font-weight: 770;
        }

        .legend-item.filter-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 1vh;
            font-weight: 770;
            padding: 0.5vmin 1.5vmin;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(74, 105, 189, 0.05);
            font-size: 2.2vmin;
        }

        .filter-item:hover {
            background: rgba(74, 105, 189, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Control Panel Container */
        .control-panel-container {
            position: relative;
            width: 100%;
            background: var(--paper);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
            padding: 1.5vmin;
        }

        .control-panel-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .control-title {
            font-size: 3vmin;
            font-weight: 800;
            margin-bottom: 2vmin;
            color: #333;
            text-align: center;
            background: var(--classy-blue-ink);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        /* Play Button */
        #play-button-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2vmin;
        }

        



        #play-button.playing::before {
            content: '⏸';
        }

        #play-button.paused:before {
            content: '\II';
            animation: wiggle 1s infinite;
            }

        /* Speed Controls */
        #speed-button-container {
            display: flex;
            justify-content: center;
            gap: 0.5vmin;
            flex-wrap: wrap;
        }

        .speed-button {
            padding: 1vmin 1.5vmin;
            border: 2px solid var(--classy-blue-ink);
            background: var(--paper);
            color: var(--classy-blue-ink);
            border-radius: 20px;
            font-size: 2vmin;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .speed-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .speed-button.active {
            background: var(--classy-blue-ink);
            color: var(--paper);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }


        .search-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }


        .search-results {
            list-style: none;
            max-height: 65vmin;
            overflow-y: auto;
            padding: 0;
            margin: 0;
        }

        .search-results li {
            padding: 0.5vmin 2vmin;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: 770;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 2vmin;
        }

        .search-results li:hover {
            background: rgba(74, 105, 189, 0.1);
        }




        /* Alert Box */
        .alert-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 3vmin;
            z-index: 10000;
            max-width: 80vw;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
        }

        #exit-button {
            position: absolute;
            top: 1.5vmin;
            right: 1.5vmin;
            width: 5vmin;
            height: 5vmin;
            border-radius: 50%;
            font-size: 2.5vmin;
            color: #666;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 770;
        }

        #exit-button:hover {
            background: #e0e0e0;
            transform: scale(1.1);
        }

        #message {
            font-size: 2.5vmin;
            line-height: 1.6;
            color: #333;
            font-weight: 500;
            margin-right: 3vmin;
        }

        /* Responsive Design */
@media (max-width: 768px) {

  /* Don't do this on mobile; it breaks layouts */
  * { overflow: visible; }

  body {
    overflow: hidden;           /* no page scrolling */
    height: 100vh;
  }

  /* Header stays as-is; we just make the grid fill the remaining height */
  .container-grid {
    height: calc(100vh - 0px);  /* overall */
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;   /* header takes auto, grid takes rest */
    gap: 1vmin;
  }

  .header {
    margin-bottom: 0;
  }

  /* Make the 3-column desktop grid turn into:
     TOP HALF (controls+legend | visible) and BOTTOM HALF (map)
  */
  .container-grid {
    grid-template-areas:
      "header"
      "main";
  }

  /* Turn your existing 3-column layout into a single mobile layout */
  .container-grid > .left-container,
  .container-grid > .central-container,
  .container-grid > .right-container {
    margin: 0;
  }

  /* We’ll re-layout by making container-grid itself the main grid below header.
     Easiest: treat the 3 containers as grid items in a 2x2 layout. */
  .container-grid {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }

  /* Put header first */
  .header { grid-row: 1; }

  /* Create a "main" mobile grid using the three existing containers */
  .left-container,
  .right-container,
  .central-container {
    box-shadow: none; /* optional; keep if you want */
  }

  /* Make the area under header a 2-row grid: top half + bottom half */
  .container-grid {
    align-items: stretch;
  }

  /* Lay out the 3 containers manually using fixed heights */
  .left-container,
  .right-container {
    height: 50vh; /* top half */
  }

  .central-container {
    height: 50vh; /* bottom half */
  }

  /* Now the top half is actually TWO columns:
     left-container = left column
     right-container = right column
     We'll place them side-by-side by making a wrapper grid effect:
     Use container-grid to become 2 columns for the top row only by
     switching to a nested grid approach:
  */

  /* Convert container-grid (below header) to:
     row 1: 2 columns (left/right)
     row 2: map full width
  */
  .container-grid {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 0.8fr 1.2fr; /* header | top | bottom */
    column-gap: 1vmin;
    row-gap: 1vmin;
    padding: 1vmin;
  }

  .header {
    grid-column: 1 / -1;
    grid-row: 1;
  }

  .left-container {
    grid-column: 1;
    grid-row: 2;
    height: auto;      /* let the grid control height */
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 1vmin;
    border-radius: 16px;
  }

  .right-container {
    grid-column: 2;
    grid-row: 2;
    height: auto;
    overflow: hidden;
    border-radius: 16px;
  }

  .central-container {
    grid-column: 1 / -1;
    grid-row: 3;
    height: auto;
    overflow: hidden;
    border-radius: 16px;
    position: relative;
  }

  /* LEFT column split: 1/3 controls + 2/3 legend */
  .control-panel-container {
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
  }

  .control-title{
    margin-bottom:0.5vmin;
  }

  #play-button-container {
    margin-bottom: 0.5vmin;
  }


  /* RIGHT column: visible list full height */
  #visible-container {
    height: 100%;
    max-height: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #visible-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }

  /* MAP full width in bottom half */
  #map {
    height: 100%;
    width: 100%;
    margin-bottom: 0;
  }

  /* Slider: keep it usable on mobile */
  #year-slider {
    width: calc(100% - 20vmin);
    left: 10vmin;
    bottom: 30vmin;
    transform: none;
    z-index: 1500;
  }


}

    </style>
</head>
<body>
    <div class="alert-box" id="customAlert">
        <p id="message"></p>
        <button id='exit-button' onclick="hideCustomAlert(restart=false)">×</button>
    </div>
    
    <div class="header-section">
        <div class="header">

            <h1>
                <span class="emoji">🔭</span> 
                <span class="gradient-text">Watch</span>
            </h1>
            <p class="subtitle">Visualize the Jewish journey through time and space like never before.</p>
        </div>
        <button class="modern-button" id="home-button" onclick="window.location.href='index.html'">🏠</button>
        <button class="modern-button" id="info-button">ℹ️</button>
        <button class="modern-button second-right-button" id="feedback-button" 
        onclick="window.location.href='feedback.html'">📩</button>
    </div>

    <div class="container-grid">
        <div class="left-container">

            <div class="panel control-panel-container">
                <h3 class="panel-heading control-title">Controls</h3>
                
                <div id="play-button-container">
                    <button id="play-button" class="watch round-sweep"></button>
                    <audio id="song" preload="auto"></audio>
                </div>
                
                <div id="speed-button-container">
                    <button class="speed-button watch">0.25x</button>
                    <button class="speed-button watch">0.5x</button>
                    <button class="speed-button watch active">1x</button>
                    <button class="speed-button watch">2x</button>
                    <button class="speed-button watch">4x</button>
                </div>
            </div>
            <!-- Background Legend -->
            <div class="panel legend-container" id="legend">
                <div class="panel-heading" id="background-heading">Background</div>
                
                <div class="legend-content">
                    <div class="legend-item filter-item" id="gaon-legend">
                        <div class="color-box" id="gaon-color"></div>
                        <div class="item-label">Gaon</div>
                    </div>
                    <div class="legend-item filter-item" id="sefarad-legend">
                        <div class="color-box" id="sefarad-color"></div>
                        <div class="item-label">Sefarad</div>
                    </div>
                    <div class="legend-item filter-item" id="ashkenaz-legend">
                        <div class="color-box" id="ashkenaz-color"></div>
                        <div class="item-label">Ashkenaz</div>
                    </div>
                    <div class="legend-item filter-item" id="provence-legend">
                        <div class="color-box" id="provence-color"></div>
                        <div class="item-label">Provence</div>
                    </div>
                    <div class="legend-item filter-item" id="italian-legend">
                        <div class="color-box" id="italian-color"></div>
                        <div class="item-label">Italian</div>
                    </div>
                    <div class="legend-item filter-item" id="chassidic-legend">
                        <div class="color-box" id="chassidic-color"></div>
                        <div class="item-label">Chassidic</div>
                    </div>
                    <div class="legend-item filter-item" id="litvish-legend">
                        <div class="color-box" id="litvish-color"></div>
                        <div class="item-label">Litvish</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="central-container">

            
            <div id="map"></div>
            <div id="year-slider"></div>


        </div>

        <div class="right-container">
            <!-- Control Panel -->

            <!-- Who You're Seeing -->
            <div class="panel search-container" id="visible-container">
                <h3 class="panel-heading">Who You're Seeing</h3>
                <ul class="search-results" id="visible-list"></ul>
            </div>
        </div>
    </div>

    <div id="popup" class="popup">
        <span class="popup-message"></span>
    </div>

    <script>
        function toggleLegend() {
            const legend = document.querySelector('.legend-container');
            legend.classList.toggle('minimized');
            
            const btn = document.querySelector('.minimize-btn');
            if (legend.classList.contains('minimized')) {
                btn.textContent = '+';
            } else {
                btn.textContent = '−';
            }
        }

        // Adapt colors automatically (keeping original script compatibility)
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof getColor === 'function' && typeof capitalizeWords === 'function') {
                const colorBoxes = document.querySelectorAll('.color-box');
                colorBoxes.forEach(item => {
                    const colorType = item.id.split('-')[0];
                    item.style.backgroundColor = getColor(capitalizeWords(colorType));
                });

            }
        });
    </script>
</body>
<script src="global.js"></script>
<script type="module" src="watch.js"></script>
</html>
