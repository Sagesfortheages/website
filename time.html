<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Era</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://t.contentsquare.net/uxa/88078fff335dd.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="icon" href="icon3.png" type="image/x-icon">
    <link rel="shortcut icon" href="icon3.png" type="image/x-icon">
    <link rel="stylesheet" href="https://unpkg.com/intro.js/minified/introjs.min.css">
    <link rel="stylesheet" href="all_styles.css">
    <script src="https://unpkg.com/intro.js/minified/intro.min.js"></script>
    
    <style>
        

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }


        @keyframes slideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

  #search-container{
    position:relative;
    grid-column: 1;
    grid-row: 2;
    height: 100%;
    width:30%;
    /* align-items: center;
    align-self: center;
    align-content: center; */
    justify-self: center;
    /* justify-items: center; */
    /* justify-content: center; */
    overflow: visible;
    margin-bottom: 1vmin;
    z-index: 50;
  }

  .search-results{
  list-style: none;
  min-height: 0vmin;
  max-height: 20vmin;
  overflow-y: auto;
  position: absolute;
  top: calc(100% + 0.5vmin);  /* right below the input */
  left: 0;
  right: 0;

  margin: 0;
  overflow-y: auto;
}

/* List items (final effective behavior: transparent + separators + accent hover) */
#search-results li{
  padding: 0.25vmin 2vmin;
  cursor: pointer;
  font-weight: 500;
  font-size: 2vmin;

  border-top: 1px solid rgba(110, 85, 55, 0.14);
  background: transparent;

  transform: translateY(10px);
  animation: fadeInUp 0.6s forwards;
}

#search-results li:hover{
  background: var(--accent-wash);
}

        /* Button containers */
        .chart-button-container {
            display: flex;
            flex-wrap: wrap;
            width: fit-content;
            gap: 1vw;
            justify-self: center;
            margin-bottom: 1vh;
            padding: 1vmin;
            padding-left: 2vw;
            padding-right: 2vw;
            background: var(--paper);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .chart-button-item {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-button-item:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .chart-button-item:active {
            transform: translateY(-1px) scale(1.02);
        }

        /* Sort buttons */
        #sort-chronological, #sort-alphabetical {
            background: linear-gradient(135deg, #3f6868 0%, #2f4f4f 100%);
        }

        /* Selected sort / filter chip */
        .chart-button-item.filter-clicked{
            border: 3px solid #76411c !important;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
            transform: translateY(1px) scale(1.03);
        }


        /* Timeline container */



        /* Alert box + exit button come from all_styles.css */
        .alert-box {
            z-index: 10000;
            max-width: 500px;
            width: 90%;
        }

/* =========================
   TIMELINE HIGHLIGHT FLASH
   ========================= */

.bar.flash {
  stroke: #2f241b;
  stroke-width: 0.6vmin;
  opacity: 1 !important;
  filter:
    brightness(1.18)
    saturate(1.18)
    drop-shadow(0 0 1.2vmin rgba(255, 215, 120, 0.85))
    drop-shadow(0 0 2.2vmin rgba(255, 215, 120, 0.55))
    drop-shadow(0 0.8vmin 1.4vmin rgba(0, 0, 0, 0.28));
  transition: all 0.25s ease;
}

.y-label.flash {
  font-weight: 900;
  fill: #1f140f !important;
  font-size: 2.6vmin;
  letter-spacing: 0.08vmin;

  filter:
    drop-shadow(0 0 0.9vmin rgba(255, 220, 140, 0.85))
    drop-shadow(0 0 1.6vmin rgba(255, 220, 140, 0.55));

  transition: all 0.22s ease;
}





@media (max-width: 768px) {

  /* Use the full viewport height, and remove extra spacing */
  body { overflow: hidden; }
  .container{
    height: 100vh;
    padding: 1vmin;
    display: flex;
    flex-direction: column;
  }

  /* Keep header + fixed home/info as-is; just tighten spacing */
  .header{ margin-bottom: 1vmin; }

  /* 10% top controls area split 50/50 */
  #sorting-container,
  #background-container{
    width: 100%;
    margin: 0;
    padding: 1vmin;
  }



  /* Put them in a horizontal split */
  /* (We do this by wrapping via a grid on the parent container) */
  .container{
    display: grid;
    grid-template-rows: 5vh 25vh 42vh 15vh;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
    "search search"
      "sort filters"
      "timeline timeline"
      "xaxis xaxis";
    gap: 1vmin;
  }


  #sorting-container{
    grid-area: sort;
    height: 25vh;            /* 10%–40% zone (top 40% total after header) */
  }

  #search-container{
    grid-area:search;
    width:40%
  }

  #background-container{
    grid-area: filters;
    height: 25vh;            /* same as sort side */
  }

  /* Bottom 60% timeline */
  #timeline-container{
    grid-area: timeline;
    height: 45vh;
    margin: 0;
  }

  /* X-axis stays at the bottom */
  #x-axis-container{
    grid-area: xaxis;
    margin: 0;
    height:50%;
  }

  /* Buttons a bit more compact so they fit well in the 40% zone */
  .chart-button-item{
    padding: 0.5vmin;
    font-size: 3vmin;
    border-radius: 14px;
    white-space: nowrap;
  }

  /* Prevent nested scrollbars; timeline handles the scrolling */
  .chart-button-container{ overflow: hidden; }
  #timeline-container{ overflow-y: auto; overflow-x: hidden; }
}


        @media (max-width: 480px) {
            .chart-button-container {
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .chart-button-item {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="alert-box" id="customAlert">
        <p id="message"></p>
        <button id='exit-button' onclick="hideCustomAlert(restart=false)">×</button>
    </div>

    
        <div class="header-section">
            <div class="header">
                <h1>
                    <span class="emoji" style="font-size: 8vmin;">🕰️</span> 
                    <span class="gradient-text">Era</span>
                </h1>
                <p class="subtitle">Journey through time and discover the chronological story of Jewish wisdom.</p>
                <button class="modern-button" id="home-button" onclick="window.location.href='index.html'">🏠</button>
                <button class="modern-button" id="info-button">ℹ️</button>
                <button class="modern-button second-right-button" id="feedback-button" 
                onclick="window.location.href='feedback.html'">📩</button>
            </div>
        </div>
    <div class="container">
        <div class="panel search-container" id="search-container">
            <input type="text" class="search-input" id="search-input" placeholder="🔍 Search for a sage...">
            <ul class="search-results panel" id="search-results"></ul>
        </div>   

        <!-- Sort buttons for chronological and alphabetical order -->
        <div class="chart-button-container" id="sorting-container">
            <div class="chart-button-item" id="sort-chronological">📅 Chronological Order</div>
            <div class="chart-button-item" id="sort-alphabetical">🔤 Alphabetical Order</div>
        </div>

        <!-- Legend to filter by background -->
        <div class="chart-button-container" id="background-container">
            <div class="chart-button-item filter-item" data-background="Gaon">
                Gaon
            </div>
            <div class="chart-button-item filter-item" data-background="Ashkenaz">
                Ashkenaz
            </div>
            <div class="chart-button-item filter-item" data-background="Sefarad">
                Sefarad
            </div>
            <div class="chart-button-item filter-item" data-background="Provence" >
                Provence
            </div>
            <div class="chart-button-item filter-item" data-background="Italian">
                Italian
            </div>
            <div class="chart-button-item filter-item" data-background="Chassidic">
                Chassidic
            </div>
            <div class="chart-button-item filter-item" data-background="Litvish">
                Litvish
            </div>
        </div>

        <!-- Scrollable Timeline -->
        <div id="timeline-container">
            <div id="chart"></div>
        </div>

        <!-- Fixed X-axis -->
        <div id="x-axis-container">
            <svg id="x-axis-svg" width="100%" height="50"></svg>
        </div>
    </div>

    <div id="popup" class="popup">
        <span class="popup-message"></span>
    </div>

    <script src="global.js"></script>
    <script type="module" src="time.js"></script>
</body>
</html>
