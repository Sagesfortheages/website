<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="icon3.png" type="image/x-icon" />
  <link rel="shortcut icon" href="icon3.png" type="image/x-icon" />

  <title>Teacher Tools – Sages For The Ages</title>

  <link rel="stylesheet" href="all_styles.css" />

  <style>
    body {
      overflow-y: auto;
    }

    main {
      width: min(92vw, 900px);
      margin: 2vmin auto 6vmin;
    }

    .teacher-card {
      overflow: hidden;
    }

    .teacher-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--rule-faint);
      position: relative;
      z-index: 1;
    }

    .teacher-tab {
      background: transparent;
      border: 0;
      padding: 1.4vmin 1vmin;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: clamp(12px, 1.7vmin, 16px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0.75;
      transition: background 0.18s ease, color 0.18s ease, opacity 0.18s ease;
    }

    .teacher-tab:hover {
      background: rgba(255,255,255,0.30);
      opacity: 1;
    }

    .teacher-tab.active {
      color: var(--classy-blue-ink);
      opacity: 1;
      background: rgba(47,79,79,0.06);
      border-bottom: 3px solid var(--classy-blue-ink);
    }

    .teacher-panel {
      display: none;
      padding: 1vmin;
      position: relative;
      z-index: 1;
    }

    .teacher-panel.active {
      display: block;
    }

    .section-head {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1vmin;
      margin-bottom: 1.5vmin;
    }

    .section-head .rule {
      height: 1px;
      background: var(--rule);
    }

    .section-head h2 {
      margin: 0;
      font-family: var(--font-ui);
      font-size: clamp(13px, 1.8vmin, 18px);
      color: var(--heading-ink);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .field-group {
      margin-bottom: 1vmin;
    }

    .field-label {
      display: block;
      margin-bottom: 0.7vmin;
      font-family: var(--font-ui);
      font-size: clamp(12px, 1.5vmin, 15px);
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--heading-ink);
    }

    .teacher-input,
    .teacher-select {
      width: 100%;
      padding: 1.1vmin 1.3vmin;
      border: 1px solid rgba(139,115,85,0.35);
      border-radius: var(--radius-sm);
      outline: none;
      font-family: var(--font-body);
      font-size: var(--fs-input);
      font-weight: 500;
      background: rgba(255,255,255,0.7);
      color: var(--input-ink);
      box-shadow: inset 0 1px 6px rgba(0,0,0,0.08);
    }

    .teacher-input:focus,
    .teacher-select:focus {
      border-color: var(--rule-strong);
      box-shadow:
        inset 0 1px 6px rgba(0,0,0,0.08),
        0 0 0 3px rgba(47,79,79,0.12);
      background: rgba(255,255,255,0.84);
    }

    .teacher-select {
      cursor: pointer;
    }

    .helper-text {
      margin-top: 0.5vmin;
      font-family: var(--font-body);
      font-size: clamp(13px, 1.7vmin, 16px);
      font-style: italic;
      color: var(--ink-soft);
      opacity: 0.75;
    }

    .teacher-actions {
      margin-top: 1vmin;
      display: flex;
      justify-content: center;
    }

    .result-wrap {
      margin-top: 1.5vmin;
      padding-top: 1vmin;
      border-top: 1px solid var(--rule-faint);
    }


    .teacher-result {
      min-height: 8vmin;
      margin: 0;
      padding: 1.4vmin;
      background: rgba(255,255,255,0.45);
      border: 1px dashed var(--rule);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: clamp(14px, 1.8vmin, 17px);
      color: var(--ink);
      word-break: break-word;
    }

    .teacher-result:empty::before {
      content: "Response will appear here…";
      color: var(--ink-soft);
      opacity: 0.7;
      font-style: italic;
    }

    .result-card {
      border-radius: var(--radius-sm);
      padding: 1.4vmin;
      background: rgba(255,255,255,0.42);
      border: 1px solid var(--rule-faint);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .result-card.success {
      border-color: rgba(47,79,79,0.35);
      background: rgba(47,79,79,0.07);
    }

    .result-card.error {
      border-color: rgba(140,40,40,0.35);
      background: rgba(140,40,40,0.07);
    }

    .result-card.loading {
      border-color: rgba(110,85,55,0.28);
      background: rgba(255,255,255,0.35);
    }

    .result-title {
      margin-bottom: 1.2vmin;
      font-family: var(--font-ui);
      font-size: clamp(14px, 1.8vmin, 18px);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--heading-ink);
    }

    .result-card.error .result-title {
      color: rgba(140,40,40,0.96);
    }

    .result-message {
      margin-bottom: 1.2vmin;
      color: var(--ink-soft);
      font-style: italic;
      line-height: 1.45;
    }

    .result-row {
      display: grid;
      grid-template-columns: minmax(120px, 0.45fr) 1fr;
      gap: 1vmin;
      padding: 0.75vmin 0;
      border-top: 1px solid var(--rule-faint);
      align-items: baseline;
    }

    .result-row:first-of-type {
      border-top: 0;
    }

    .result-row span {
      color: var(--ink-soft);
      font-style: italic;
    }

    .result-row b {
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 0.95em;
      overflow-wrap: anywhere;
    }

    .result-small {
      margin-top: 1vmin;
      color: var(--ink-soft);
      opacity: 0.82;
      font-size: 0.95em;
      line-height: 1.35;
    }

    .result-debug {
      margin-top: 1.2vmin;
      padding: 1vmin;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.45);
      border: 1px dashed var(--rule-faint);
      font-family: monospace;
      font-size: 0.85em;
      color: var(--ink-soft);
      white-space: pre-wrap;
      max-height: 22vmin;
      overflow: auto;
    }

    @media (max-width: 700px) {
      main {
        width: 94vw;
        margin-top: 1vmin;
      }

      .teacher-tabs {
        grid-template-columns: 1fr;
      }

      .teacher-panel {
        padding: 4vmin;
      }

      .section-head {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .section-head .rule {
        display: none;
      }

      .result-row {
        grid-template-columns: 1fr;
        gap: 0.3vmin;
      }
    }
  </style>
</head>

<body>

  <div class="header-section">
    <div class="header">
      <h1>
        <span class="emoji">🧑‍🎓</span>
        <span class="gradient-text">Teacher Tools</span>
      </h1>

      <p class="subtitle">Manage students and assignments for your class.</p>

      <button
        class="modern-button"
        id="home-button"
        onclick="window.location.href='index.html'"
        title="Home"
      >
        🏠
      </button>
    </div>
  </div>

  <main>
    <div class="panel teacher-card">

      <div class="teacher-tabs" role="tablist">
        <button class="teacher-tab active" data-panel="create" role="tab" aria-selected="true">
          ✦ Create Student
        </button>

        <button class="teacher-tab" data-panel="assign" role="tab" aria-selected="false">
          ✦ Assign Game
        </button>
      </div>

      <div class="teacher-panel active" id="panel-create">
        <div class="section-head">
          <span class="rule"></span>
          <h2>New Student Account</h2>
          <span class="rule"></span>
        </div>

        <div class="field-group">
          <label class="field-label" for="class-id">Class ID</label>
          <input id="class-id" class="teacher-input" type="number" placeholder="e.g. 1" />
        </div>

        <div class="field-group">
          <label class="field-label" for="student-name">Student Display Name</label>
          <input id="student-name" class="teacher-input" type="text" placeholder="e.g. Rachelz" />
        </div>

        <div class="field-group">
          <label class="field-label" for="student-username">Student Username</label>
          <input id="student-username" class="teacher-input" type="text" placeholder="e.g. miriam_c" />
          <div class="helper-text">Use lowercase letters, numbers, or underscores.</div>
        </div>

        <div class="teacher-actions">
          <button type="button" id="create-student-btn" class="cta-button sweep">
            Create Student
          </button>
        </div>

        <div class="result-wrap">
          <div id="result" class="teacher-result"></div>
        </div>
      </div>

      <div class="teacher-panel" id="panel-assign">
        <div class="section-head">
          <span class="rule"></span>
          <h2>Mystery Sage Assignment</h2>
          <span class="rule"></span>
        </div>

        <div class="field-group">
          <label class="field-label" for="assignment-class-id">Class ID</label>
          <input id="assignment-class-id" class="teacher-input" type="number" placeholder="e.g. 1" />
        </div>

        <div class="field-group">
          <label class="field-label" for="sage-select">Choose the Mystery Sage</label>
          <select id="sage-select" class="teacher-select">
            <option value="">Loading sages…</option>
          </select>
          <div class="helper-text">Students in this class will play with this sage as the correct answer.</div>
        </div>

        <div class="teacher-actions">
          <button type="button" id="assign-sage-btn" class="cta-button sweep">
            Assign Sage
          </button>
        </div>

        <div class="result-wrap">
          <div id="assign-result" class="teacher-result"></div>
        </div>
      </div>

    </div>
  </main>

  <script>
    document.querySelectorAll('.teacher-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.teacher-tab').forEach(t => {
          t.classList.remove('active');
          t.setAttribute('aria-selected', 'false');
        });

        document.querySelectorAll('.teacher-panel').forEach(p => {
          p.classList.remove('active');
        });

        tab.classList.add('active');
        tab.setAttribute('aria-selected', 'true');

        document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
      });
    });
  </script>

  <script type="module">
    import { supabaseClient } from './supabase/supabaseClient.js';
    import { loadAllSages } from './supabase/sagesWithNames.js';

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function readJsonSafely(res) {
      const text = await res.text();

      if (!text) return null;

      try {
        return JSON.parse(text);
      } catch {
        return { rawText: text };
      }
    }

    function showLoading(resultEl, message) {
      resultEl.innerHTML = `
        <div class="result-card loading">
          <div class="result-title">⏳ Working…</div>
          <div class="result-message">${escapeHtml(message)}</div>
        </div>
      `;
    }

    function showSuccess(resultEl, title, rows = [], message = "") {
      resultEl.innerHTML = `
        <div class="result-card success">
          <div class="result-title">✅ ${escapeHtml(title)}</div>
          ${message ? `<div class="result-message">${escapeHtml(message)}</div>` : ""}
          ${rows.map(row => `
            <div class="result-row">
              <span>${escapeHtml(row.label)}</span>
              <b>${escapeHtml(row.value || "—")}</b>
            </div>
          `).join("")}
        </div>
      `;
    }

    function showError(resultEl, title, message, details = null) {
      resultEl.innerHTML = `
        <div class="result-card error">
          <div class="result-title">⚠️ ${escapeHtml(title)}</div>
          <div class="result-message">${escapeHtml(message)}</div>
          ${details ? `<div class="result-debug">${escapeHtml(details)}</div>` : ""}
        </div>
      `;
    }

    function friendlyApiError(data, fallback) {
      if (!data) return fallback;
      return (
        data.userMessage ||
        data.message ||
        data.error ||
        data.details ||
        data.rawText ||
        fallback
      );
    }

    async function createStudent(e) {
      e?.preventDefault();

      const classId = Number(document.getElementById('class-id').value);
      const displayName = document.getElementById('student-name').value.trim();
      const username = document.getElementById('student-username').value.trim();
      const resultEl = document.getElementById('result');

      if (!classId || !displayName || !username) {
        showError(
          resultEl,
          "Missing information",
          "Please enter a class ID, display name, and username before creating the student."
        );
        return;
      }

      showLoading(resultEl, "Creating the student account…");

      try {
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session?.access_token) {
          showError(
            resultEl,
            "Not signed in",
            "No logged-in teacher session was found. Please sign in again and retry."
          );
          return;
        }

        const res = await fetch('/api/create_student', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({ classId, displayName, username })
        });

        const data = await readJsonSafely(res);

        if (!res.ok || data?.success === false) {
          showError(
            resultEl,
            "Student was not created",
            friendlyApiError(data, "The student could not be created. Please check the class ID and username, then try again."),
            data?.rawText ? data.rawText : JSON.stringify(data, null, 2)
          );
          return;
        }

        const student = data?.student || data?.data?.student || data || {};

        showSuccess(
          resultEl,
          "Student created successfully",
          [
            { label: "Display name", value: student.display_name || student.displayName || displayName },
            { label: "Username", value: student.username || username },
            { label: "Class ID", value: student.class_id || student.classId || classId },
            { label: "Student PIN", value: student.pin || student.tempPin || student.temporary_pin || "Check your saved student record" }
          ],
          "The student can now use this account to access assigned activities."
        );

      } catch (err) {
        console.error(err);
        showError(
          resultEl,
          "Student was not created",
          "Something went wrong while creating the student. Please check your connection and try again.",
          err.message
        );
      }
    }

    async function loadSagesDropdown() {
      const sageSelect = document.getElementById('sage-select');

      try {
        const sages = await loadAllSages();

        const unique = [...new Map(sages.map(s => [s.person, s])).values()]
          .sort((a, b) => a.person.localeCompare(b.person));

        sageSelect.innerHTML = `<option value="">Select a sage…</option>`;

        unique.forEach(s => {
          const option = document.createElement('option');
          option.value = s.person;
          option.textContent = s.person;
          sageSelect.appendChild(option);
        });
      } catch (err) {
        console.error('Error loading sages:', err);
        sageSelect.innerHTML = `<option value="">Failed to load sages</option>`;

        showError(
          document.getElementById('assign-result'),
          "Could not load sages",
          "The sage list could not be loaded. Refresh the page and try again.",
          err.message
        );
      }
    }

    async function assignSage(e) {
      e?.preventDefault();

      const classId = Number(document.getElementById('assignment-class-id').value);
      const targetSagePerson = document.getElementById('sage-select').value;
      const resultEl = document.getElementById('assign-result');

      if (!classId || !targetSagePerson) {
        showError(
          resultEl,
          "Missing information",
          "Please enter a class ID and choose a mystery sage before creating the assignment."
        );
        return;
      }

      showLoading(resultEl, "Creating the assignment for this class…");

      try {
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session?.access_token) {
          showError(
            resultEl,
            "Not signed in",
            "No logged-in teacher session was found. Please sign in again and retry."
          );
          return;
        }

        const res = await fetch('/api/create_assignment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            classId,
            targetSagePerson,
            activityType: 'mystery_sage'
          })
        });

        const data = await readJsonSafely(res);

        if (!res.ok || data?.success === false) {
          showError(
            resultEl,
            "Assignment was not created",
            friendlyApiError(
              data,
              "The assignment could not be created. Please check the class ID and try again."
            ),
            data?.rawText ? data.rawText : JSON.stringify(data, null, 2)
          );
          return;
        }

        const assignment = data?.assignment || data?.data?.assignment || {};

        showSuccess(
          resultEl,
          "Assignment created successfully",
          [
            { label: "Class", value: assignment.className || assignment.class_name || `Class ${classId}` },
            { label: "Activity", value: assignment.title || "Mystery Sage" },
            { label: "Mystery sage", value: assignment.targetSagePerson || assignment.target_sage_person || targetSagePerson },
            { label: "Assignment ID", value: assignment.id || assignment.assignment_id || "Created" }
          ],
          "Students in this class can now complete the assignment."
        );

      } catch (err) {
        console.error(err);
        showError(
          resultEl,
          "Assignment was not created",
          "Something went wrong while creating the assignment. Please check your connection and try again.",
          err.message
        );
      }
    }

    document.getElementById('create-student-btn').addEventListener('click', createStudent);
    document.getElementById('assign-sage-btn')?.addEventListener('click', assignSage);

    loadSagesDropdown();
  </script>

</body>
</html>
