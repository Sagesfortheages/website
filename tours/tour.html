<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Major Chumash Commentaries</title>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.1/nouislider.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.1/nouislider.min.css" rel="stylesheet" />

  <link rel="icon" href="../icon3.png" type="image/x-icon" />
  <link rel="shortcut icon" href="../icon3.png" type="image/x-icon" />
  <link rel="stylesheet" href="../all_styles.css" />

  <style>
    /* ── Tour-specific layout (not in all_styles.css) ── */

    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 8%, rgba(255, 248, 226, 0.35), transparent 35%),
        var(--page-texture), var(--page-fallback);
      color: var(--ink);
    }

    .tour-shell {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header: standard site header (all_styles.css); it just must not flex-grow */
    .header-section {
      flex: 0 0 auto;
    }

    /* ── Main page area ── */
    .tour-page {
      flex: 1;
      padding: 1.5vh 1.8vw 1.4vh;
      display: grid;
      grid-template-rows: 1fr auto auto;
      gap: 1.4vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 12%, rgba(255,255,255,0.35), transparent 30%),
        var(--page-texture);
      background-size: cover;
    }

    /* ── Module header ── */
    .module-head {
      text-align: center;
      display: grid;
      justify-items: center;
      gap: 0.5vh;
    }

    .module-badge-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5vw;
    }

    .ornament {
      width: 7vw;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(73, 49, 26, 0.65), transparent);
      position: relative;
    }
    .ornament::after {
      content: "❧";
      position: absolute;
      left: 50%;
      top: -1.05vmin;
      transform: translateX(-50%);
      font-size: 2vmin;
      color: rgba(73, 49, 26, 0.7);
    }

    .module-badge {
      background: linear-gradient(180deg, #183047, #0e2234);
      color: #f3dfb6;
      border: 1px solid rgba(226, 196, 132, 0.75);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 0.2vmin 0.6vmin rgba(0,0,0,0.28);
      border-radius: 0.35vmin;
      padding: 0.35vmin 2.4vmin;
      font-family: var(--font-ui);
      font-size: clamp(11px, 1.45vmin, 16px);
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .module-title {
      font-family: var(--font-ui);
      font-size: clamp(35px, 5.1vmin, 76px);
      font-weight: 400;
      letter-spacing: 0.12em;
      color: #251911;
      line-height: 1;
      text-transform: uppercase;
    }

    .module-subtitle {
      font-family: var(--font-body);
      font-size: clamp(17px, 2.2vmin, 28px);
      font-style: italic;
      letter-spacing: 0.08em;
      color: rgba(22, 27, 36, 0.88);
    }

    /* ── Map + info grid ──
       The info panel gets nearly half the width so the sage text fits. */
    .tour-main-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 1.2vw;
    }

    .map-panel,
    .info-panel {
      min-height: 0;
      border: 1px solid rgba(92, 64, 35, 0.46);
      outline: 2px solid rgba(92, 64, 35, 0.14);
      background:
        linear-gradient(rgba(245, 230, 196, 0.28), rgba(245, 230, 196, 0.28)),
        var(--page-texture);
      background-size: cover;
      box-shadow:
        inset 0 0 2.2vmin rgba(84, 54, 24, 0.12),
        0 0.4vmin 1.4vmin rgba(55, 35, 15, 0.13);
      position: relative;
      overflow: hidden;
    }

    /* Map on top, timeline strip beneath it — both inside the map panel */
    .map-panel {
      padding: 1vmin;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: auto;
      flex: 1;
      min-height: 0;
      border: 1px solid rgba(66, 46, 24, 0.32);
      filter: sepia(0.18) saturate(0.78);
      background: #d5c49a;
      /* override all_styles.css radius on #map */
      border-radius: 0;
      box-shadow: none;
    }

    /* ── Info panel ── */
    .info-panel {
      padding: 1.5vmin 2vmin;
      display: grid;
      grid-template-rows: repeat(6, auto);
      align-content: start;
      gap: 1vmin;
      /* override the shared `overflow: hidden` so long content scrolls
         instead of being clipped by the fixed panel height */
      overflow-y: auto;
      overflow-x: hidden;
    }

    .current-stop-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1vw;
      font-family: var(--font-ui);
      font-size: clamp(15px, 1.8vmin, 22px);
      letter-spacing: 0.18em;
      color: #2a1d13;
      text-transform: uppercase;
    }
    .current-stop-label::before,
    .current-stop-label::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(75, 52, 27, 0.52), transparent);
    }

    .stop-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1.4vmin;
      align-items: center;
    }

    /* #icon-space is the stop number button — distinct from all_styles.css #play-button */
    #icon-space {
      width: 5.8vmin;
      height: 5.8vmin;
      border-radius: 50%;
      border: 1px solid rgba(234, 216, 173, 0.75);
      background: radial-gradient(circle at 35% 28%, #1d3b57, #071827);
      color: #f3dfb6;
      font-family: var(--font-ui);
      font-size: clamp(18px, 2.6vmin, 33px);
      display: grid;
      place-items: center;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.12),
        0 0.3vmin 0.9vmin rgba(0,0,0,0.22);
      cursor: default;
    }

    #name-content {
      font-family: var(--font-ui);
      font-size: clamp(24px, 3.05vmin, 45px);
      line-height: 1.06;
      color: #22160f;
      letter-spacing: 0.03em;
    }

    .stop-copy {
      font-family: var(--font-body);
      font-size: clamp(15px, 1.65vmin, 21px);
      line-height: 1.34;
      color: #211812;
      max-width: 95%;
      margin-left: 4.8vmin;
    }

    /* Event text (tour.js adds .event-text while an event is on screen):
       larger and set off with a gold rule so it reads as the main content. */
    .stop-copy.event-text {
      font-size: clamp(19px, 2.4vmin, 32px);
      line-height: 1.42;
      font-weight: 500;
      color: #1a110b;
      margin-left: 1.5vmin;
      max-width: 100%;
      padding: 1.2vmin 0 1.2vmin 2vmin;
      border-left: 0.5vmin solid #b8913f;
      background: linear-gradient(90deg, rgba(237, 219, 181, 0.55), transparent 85%);
    }

    .quote-box {
      margin: 0.2vmin 1.5vmin;
      padding: 1.2vmin 2vmin;
      border: 1px solid rgba(99, 68, 35, 0.38);
      background: rgba(237, 219, 181, 0.42);
      box-shadow: inset 0 0 1.4vmin rgba(82, 50, 23, 0.07);
      text-align: center;
      font-family: var(--font-body);
      font-size: clamp(15px, 1.55vmin, 20px);
      font-style: italic;
      color: #2b1f15;
      position: relative;
    }
    .quote-box::before {
      content: "\201C";
      font-size: 4vmin;
      position: absolute;
      left: 1.1vmin;
      top: -0.8vmin;
      color: rgba(72, 45, 22, 0.55);
    }

    /* When the box holds a sage's name caption instead of a quote,
       drop the quotation mark and the italic styling. */
    .quote-box.caption {
      font-style: normal;
      letter-spacing: 0.04em;
    }
    .quote-box.caption::before { content: none; }

    .featured-title {
      display: flex;
      align-items: center;
      gap: 1vw;
      font-family: var(--font-ui);
      letter-spacing: 0.15em;
      font-size: clamp(12px, 1.35vmin, 16px);
      text-transform: uppercase;
      color: #2c1e14;
    }
    .featured-title::before,
    .featured-title::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(82, 54, 29, 0.45);
    }

    /* Portraits split into balanced rows and spread evenly across the panel.
       --sage-per-row is set by tour.js (renderSageStrip) from the sage count. */
    .sage-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      row-gap: 1vmin;
      align-items: flex-start;
      padding-bottom: 0.6vmin;
    }

    .sage-mini {
      flex: 0 0 calc(100% / var(--sage-per-row, 5));
      text-align: center;
      font-family: var(--font-body);
      font-size: clamp(13px, 1.45vmin, 18px);
      color: #21160f;
    }

    .sage-portrait {
      width: 7.5vmin;
      height: 7.5vmin;
      border-radius: 50%;
      margin: 0 auto 0.45vmin;
      overflow: hidden;
      border: 2px solid rgba(98, 67, 36, 0.6);
      background:
        radial-gradient(circle at 42% 38%, rgba(255,255,255,0.26), transparent 22%),
        linear-gradient(145deg, #d5c19a, #837052);
      box-shadow: inset 0 0 1.1vmin rgba(0,0,0,0.18);
      filter: sepia(0.35);
    }

    /* Portraits show the sage's biography on hover (see tour.js renderSageStrip).
       The image ignores the pointer so the hover lands on .popup-button. */
    .sage-portrait.popup-button { cursor: help; }

    .sage-portrait img {
      pointer-events: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* ── Chapter cards ── */
    /* one card per sage; --chapter-count is set by tour.js to the sage total */
    .chapter-cards {
      display: grid;
      grid-template-columns: repeat(var(--chapter-count, 6), minmax(0, 1fr));
      gap: 1vw;
    }

    .chapter-card {
      min-height: 11.2vh;
      border: 1px solid rgba(94, 65, 34, 0.42);
      background:
        linear-gradient(rgba(244, 227, 192, 0.4), rgba(244, 227, 192, 0.4)),
        var(--page-texture);
      background-size: cover;
      box-shadow:
        inset 0 0 1.3vmin rgba(66, 42, 20, 0.07),
        0 0.35vmin 0.9vmin rgba(45, 29, 13, 0.12);
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 0.6vmin;
      position: relative;
      cursor: pointer;
    }

    .chapter-card.active {
      border: 2px solid #143047;
      outline: 0.35vmin solid rgba(20, 48, 71, 0.25);
    }
    .chapter-card.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 1.6vmin;
      width: 1.5vmin;
      height: 4vmin;
      background: #143047;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
    }

    .chapter-num {
      font-family: var(--font-ui);
      font-size: clamp(23px, 3vmin, 38px);
      color: #2a1d13;
      line-height: 1;
    }

    .chapter-name {
      font-family: var(--font-body);
      font-size: clamp(15px, 1.75vmin, 22px);
      color: #251911;
      text-align: center;
    }

    .chapter-flourish {
      font-size: 1.8vmin;
      color: rgba(78, 52, 26, 0.58);
      line-height: 1;
    }

    /* ── Bottom controls ── */
    .bottom-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8vw;
      align-items: center;
      padding: 0 18vw;
    }

    .nav-button,
    #next-button {
      min-height: 5.7vh;
      border: 1px solid rgba(76, 50, 25, 0.36);
      border-radius: 0.6vmin;
      font-family: var(--font-body);
      font-size: clamp(18px, 2.3vmin, 29px);
      background: rgba(244, 226, 188, 0.62);
      color: #2a1d13;
      box-shadow: 0 0.35vmin 1vmin rgba(44, 27, 13, 0.12);
      cursor: pointer;
      width: 100%;
    }

    /* Next Stop is the main action, so it gets the navy treatment */
    #next-button {
      background: linear-gradient(180deg, #183047, #0d2235);
      color: #f4dfb8;
      border: 1px solid rgba(226, 196, 132, 0.65);
      box-shadow: 0 0.35vmin 1vmin rgba(44, 27, 13, 0.18);
    }

    .nav-button:disabled,
    #next-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      border-left: 1px solid rgba(81, 55, 31, 0.36);
    }

    .action-link {
      min-height: 5.7vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1vmin;
      border-right: 1px solid rgba(81, 55, 31, 0.36);
      font-family: var(--font-body);
      font-size: clamp(15px, 1.7vmin, 21px);
      color: #2a1d13;
      cursor: pointer;
    }

    .action-link .big-icon {
      font-size: 3.6vmin;
      color: #143047;
    }

    /* ── Year slider: display-only timeline in its own strip beneath the map ──
       Resets the fixed overlay positioning from all_styles.css. It is not
       clickable: the year is driven by the Previous/Next Stop buttons. */
    #year-slider {
      position: static;
      left: auto;
      right: auto;
      bottom: auto;
      z-index: auto;
      width: auto;
      transform: none;
      flex: 0 0 auto;
      /* headroom above for the year tooltip, room below for the century labels */
      margin: 5.5vmin 4vmin 7.5vmin;
      pointer-events: none;
      filter: drop-shadow(0 0.35vmin 0.8vmin rgba(0,0,0,0.18));
    }

    /* ── Popup: tour uses absolute positioning relative to cursor ── */
    /* all_styles.css .popup handles most of this; we only adjust z-index conflict */
    #popup.popup {
      z-index: 4000;
      max-width: min(34vw, 460px);
    }

    /* Sage biography inside the hover popup */
    .popup-years {
      font-weight: 400;
    }
    .popup-bio {
      margin-top: 0.6vmin;
      font-weight: 400;
      font-size: clamp(13px, 1.6vmin, 18px);
      line-height: 1.4;
      text-align: left;
      display: -webkit-box;
      -webkit-line-clamp: 12;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── Mobile ── */
    @media (max-width: 900px) {
      body { overflow: auto; }

      .tour-shell {
        height: auto;
        min-height: 100vh;
      }

      .tour-page {
        grid-template-rows: auto auto auto auto;
        overflow: visible;
      }

      .tour-main-grid { grid-template-columns: 1fr; }

      /* tall enough for the map plus the timeline strip beneath it */
      .map-panel { height: 62vh; }

      .chapter-cards { grid-template-columns: repeat(2, 1fr); }

      .bottom-controls {
        grid-template-columns: 1fr;
        padding: 0 2vw 3vh;
      }

      #year-slider { margin: 5.5vmin 5vw 11vmin; }
    }
  </style>
</head>

<body>
  <div class="alert-box" id="customAlert">
    <p id="message"></p>
    <button id="exit-button" type="button"
      onclick="document.getElementById('customAlert').style.display='none'">×</button>
  </div>

  <div class="tour-shell">

    <div class="header-section">
      <div class="header">
        <h1>
          <span class="emoji">📖</span>
          <span class="gradient-text">Major Chumash Commentaries</span>
        </h1>
        <p class="subtitle">An interactive journey through the great commentators on Chumash.</p>

        <button class="modern-button" id="home-button" type="button"
          onclick="window.location.href='../index.html'">🏠</button>

        <button class="modern-button" id="info-button" type="button"
          onclick="showCustomAlert(`An interactive journey through the great commentators on Chumash.<br><br>Use <strong>Next Stop</strong> and <strong>Previous Stop</strong> to move along the timeline from one event to the next. Hover over a sage's portrait to read his biography.`, '2.4vmin', false, false)">ℹ️</button>

        <button class="modern-button second-right-button" id="feedback-button" type="button"
          onclick="window.location.href='../feedback.html'">📩</button>
      </div>
    </div>

    <main class="tour-page">
      <section class="tour-main-grid">
        <div class="map-panel">
          <div id="map"></div>

          <!--
            tour.js creates the noUiSlider on this element by id.
            Display-only timeline strip beneath the map (see #year-slider
            rule in <style> above); tour.js also disables user interaction
            and zips it between events when Previous/Next is pressed.
          -->
          <div id="year-slider" class="watch"></div>
        </div>

        <aside class="info-panel">
          <div class="current-stop-label">Current Stop</div>

          <div class="stop-head">
            <!-- id="icon-space" is read/written by tour.js -->
            <button id="icon-space" type="button">❧</button>
            <!-- id="name-content" is read/written by tour.js -->
            <div id="name-content">Begin the Journey</div>
          </div>

          <!-- Populated per-sage by tour.js (goToSage). Starts as a prompt. -->
          <p class="stop-copy">
            Press “Next Stop” to travel through the great commentators on Chumash, one at a time.
          </p>

          <!-- Hidden until a sage is selected; filled with the sage's Hebrew name and years. -->
          <div class="quote-box" style="display:none"></div>

          <div>
            <div class="featured-title">Sages Featured in This Module</div>

            <!-- Filled by tour.js (renderSageStrip) from the module's sages -->
            <div class="sage-strip"></div>
          </div>
        </aside>
      </section>

      <!-- One card per sage, filled by tour.js (renderChapterCards) from the
           module's sages. Clicking a card jumps to that stop; the card of the
           sage currently being discussed is highlighted with .active. -->
      <section class="chapter-cards"></section>

      <section class="bottom-controls">
        <button class="nav-button" type="button">← Previous Stop</button>

        <button id="next-button" type="button">Next Stop →</button>

      </section>
    </main>

    <!--
      tour.js reads:
        document.getElementById('popup')
        document.querySelector('.popup-message')
      all_styles.css handles .popup and .popup.visible styling.
    -->
    <div id="popup" class="popup">
      <span class="popup-message"></span>
    </div>

  </div>

  <script src="../global.js"></script>
  <script type="module" src="tour.js"></script>
</body>
</html>
