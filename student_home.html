<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Home</title>
  <link rel="stylesheet" href="all_styles.css" />
  <style>
    body{
  overflow: hidden;
}

.student-home-wrap{
  min-height: calc(100vh - var(--header-height) - 2vh);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 2.5vh 2vw;
}

.student-home-card{
  width: min(680px, 94vw);
  background: var(--paper-strong);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  padding: 2vmin;
  position: relative;
  overflow: hidden;
}

.student-home-card::after{
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 18% 14%, rgba(255,255,255,0.28), transparent 40%),
    rgba(47,79,79,0.04);
  pointer-events: none;
  opacity: 0.75;
}

.student-home-card > *{
  position: relative;
  z-index: 1;
}

.student-home-head{
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1.2vmin;
  margin-bottom: 1.6vmin;
}

.student-home-head .rule{
  height: 1px;
  background: rgba(110,85,55,0.30);
}

.student-home-head h2{
  font-family: var(--font-ui);
  font-size: clamp(15px, 2.4vmin, 20px);
  letter-spacing: 0.06em;
  color: var(--heading-ink);
  font-weight: 700;
  text-transform: uppercase;
  text-align: center;
  white-space: nowrap;
}

.student-home-body{
  display: grid;
  gap: 1rem;
}

.info-block{
  background: rgba(255,255,255,0.42);
  border: 1px solid var(--rule-faint);
  border-radius: var(--radius-sm);
  padding: 0.9rem 1rem;
  box-shadow: inset 0 1px 6px rgba(0,0,0,0.04);
}

.info-label{
  font-family: var(--font-ui);
  font-size: clamp(12px, 1.9vmin, 15px);
  letter-spacing: 0.05em;
  color: var(--heading-ink);
  text-transform: uppercase;
  margin-bottom: 0.25rem;
}

.info-value{
  font-family: var(--font-display);
  font-size: clamp(24px, 4vmin, 36px);
  color: var(--title-ink);
  line-height: 1.1;
}

.info-sub{
  font-family: var(--font-body);
  font-size: clamp(15px, 2.1vmin, 18px);
  color: var(--ink-soft);
  line-height: 1.3;
}

.actions{
  display: flex;
  justify-content: center;
  margin-top: 0.4rem;
}

#start-activity-btn{
  min-width: 280px;
}

#logout-button{
  font-size: clamp(18px, 3vmin, 26px);
}

@media (max-width: 700px){
  .student-home-wrap{
    padding: 1.5vh 3vw;
  }

  .student-home-card{
    width: 100%;
    padding: 1rem;
  }

  .student-home-head h2{
    white-space: normal;
  }

  #start-activity-btn{
    width: 100%;
    min-width: 0;
  }
}
  </style>
</head>
<body>
  <div class="header-section">
    <div class="header">
      <h1>
        <span class="emoji">🎓</span>
        <span class="gradient-text">Student Home</span>
      </h1>
      <p class="subtitle">Welcome back. Continue your learning journey.</p>

      <button class="modern-button" id="home-button" onclick="window.location.href='index.html'">🏠</button>
      <button class="modern-button second-right-button" id="logout-button" type="button">⇦</button>
    </div>
  </div>

  <main class="student-home-wrap">
    <section class="student-home-card">
      <div class="student-home-head">
        <div class="rule"></div>
        <h2>Your Dashboard</h2>
        <div class="rule"></div>
      </div>

      <div class="student-home-body">
        <div class="info-block">
          <div class="info-label">Student</div>
          <div class="info-value" id="student-name">Loading...</div>
        </div>

        <div class="info-block">
          <div class="info-label">Class</div>
          <div class="info-value" id="student-class">Loading...</div>
        </div>

        <div class="info-block">
          <div class="info-label">Status</div>
          <div class="info-sub" id="student-status">Preparing your dashboard...</div>
        </div>

        <div class="actions">
          <button class="cta-button sweep" id="start-activity-btn" type="button">
            Start Activity
          </button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="student_home.js"></script>
</body>
</html>
