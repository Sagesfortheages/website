<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sages Timeline Poster</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="all_styles.css">
      <script src='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css' rel='stylesheet' />

  <style>
    @page {
      size: 24in 36in;
      margin: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 24in;
      height: 36in;
      overflow: auto;
      background: var(--page-texture), var(--paper);
    }

    .poster-page {
      box-sizing: border-box;
      width: 24in;
      height: 36in;
      padding: 0.75in;
      background: var(--page-texture), var(--paper);
      color: var(--ink);
    }

    .poster-title {
      font-family: "Cinzel", serif;
      font-size: 44pt;
      text-align: center;
      color: var(--title-ink);
      margin: 0;
    }

    .poster-subtitle {
      font-family: "Crimson Text", serif;
      font-size: 18pt;
      text-align: center;
      color: var(--ink-soft);
      margin: 0.15in 0 0.4in;
    }

    #timeline-container {
      overflow: visible;
      height: 31in;
      width: 100%;
    }

    #chart {
      width: 100%;
    }

    #x-axis-container {
      width: 100%;
      height: 0.6in;
    }

    #x-axis-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bar {
      opacity: 0.92;
    }

    .y-label {
      font-family: "Cinzel", serif;
      fill: var(--ink);
      font-size: 12pt;
    }

    .timeline-label {
      font-family: "Cinzel", serif;
      fill: var(--ink-soft);
      font-size: 12pt;
    }

    .grid line {
      stroke: rgba(90, 74, 58, 0.18);
    }

    .grid path,
    .y-axis path,
    .x-axis path {
      stroke: rgba(90, 74, 58, 0.35);
    }
  </style>
</head>

<body>
  <main class="poster-page">
    <h1 class="poster-title">1,000 Years of Torah Giants</h1>
    <p class="poster-subtitle">A classroom timeline of major sages from 1000–2000</p>

    <div id="timeline-container">
      <div id="chart"></div>
    </div>

    <div id="x-axis-container">
      <svg id="x-axis-svg"></svg>
    </div>
  </main>

  <script type="module" src="time_poster.js"></script>
  <script type="module" src="global.js"></script>
</body>
</html>
