<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Select</title>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />

    <link rel="icon" href="icon3.png" type="image/x-icon">
    <link rel="shortcut icon" href="icon3.png" type="image/x-icon">
    <link rel="stylesheet" href="all_styles.css">
    <script src="global.js"></script>

    <style>
        /* Page-specific tweaks; tiles, grid, alerts come from all_styles.css */

        /* -------- MOBILE -------- */
        @media (max-width: 600px) {
          body {
            overflow-y: auto;
          }

          .page {
            padding: 2vh 4vw 4vh;
          }

          .header {
            padding-top: 1vh;
            margin-bottom: 2vh;
          }

          .header h1 {
            font-size: 6.5vmin;
            text-align: center;
          }

          .subtitle {
            font-size: 3.2vmin;
            line-height: 1.35;
            text-align: center;
            margin: 1vh 0 2vh;
            padding: 0 2vw;
          }

          .grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 3.5vmin;
            width: 100%;
          }

          .tile {
            min-height: 20vh;
            padding: 2.5vmin;
          }

          .tile-icon {
            font-size: 7.5vmin;
            margin-bottom: 1vmin;
          }

          .tile-label {
            font-size: 3.6vmin;
            line-height: 1.25;
          }

          .alert-box {
            width: 88vw;
            padding: 3vh 5vw;
          }
        }
    </style>
</head>
<body>
    <div class="alert-box" id="customAlert">
        <p id="message"></p>
        <button id="exit-button" onclick="hideCustomAlert(restart=false)">×</button>
    </div>

    <div class="page">
        <div class="header">
            <h1>
                <span class="emoji">✈️</span>
                <span class="gradient-text">Tour</span>
            </h1>
            <p class="subtitle">Explore the paths, stories, and transformations that shaped our heritage across time and geography.</p>

            <button class="modern-button" id="home-button" onclick="window.location.href='index.html'">🏠</button>

            <button class="modern-button" id="info-button"
                onclick="showCustomAlert(`Here we have exciting animated tours exploring major themes in Jewish History. <br><br>Each tour takes you on a visual journey through time and space, revealing the stories, struggles, and triumphs that shaped our heritage. <br><br>Click one to get started on your historical adventure.`, restart=false)">
                ℹ️
            </button>

            <button class="modern-button second-right-button" id="feedback-button"
                onclick="window.location.href='feedback.html'">📩</button>
        </div>

        <div class="grid">
            <button class="tile" onclick="window.location.href='tours/tour_chabad.html'">
                <div class="tile-icon">🕯️</div>
                <div class="tile-label">Chabad Rebbes</div>
            </button>

            <button class="tile" onclick="window.location.href='tours/tour.html'">
                <div class="tile-icon">📜</div>
                <div class="tile-label">Major Chumash Commentaries</div>
            </button>

            <button class="tile coming">
                <div class="tile-icon">📖</div>
                <div class="tile-label">Major Halachic Works</div>
            </button>

            <button class="tile coming">
                <div class="tile-icon">🌍</div>
                <div class="tile-label">Tour of Jewish Expulsions</div>
            </button>

            <button class="tile coming">
                <div class="tile-icon">✨</div>
                <div class="tile-label">Golden Age of Spain</div>
            </button>



            <button class="tile coming">
                <div class="tile-icon">📚</div>
                <div class="tile-label">Nosei Keilim on Shulchan Aruch</div>
            </button>
        </div>
    </div>

    <script src="global.js"></script>
    <script type="module">
        import { trackPageView } from './supabase/supabaseFunctions.js';
        trackPageView();
    </script>
</body>
</html>
