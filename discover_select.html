<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Select</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="icon" href="icon3.png" type="image/x-icon">
    <link rel="shortcut icon" href="icon3.png" type="image/x-icon">
    <link rel="stylesheet" href="https://unpkg.com/intro.js/minified/introjs.min.css">
    <link rel="stylesheet" href="all_styles.css">
    <script src="https://unpkg.com/intro.js/minified/intro.min.js"></script>
    <style>

        .container-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr);
            width: 100%;
            gap: 2rem;
        }

        .left-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top:5vh; 
            gap: 10vh;
        }
        .central-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top:1vh; 
        }

        .right-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top:5vh; 
            gap: 10vh;
        }

        .search-container {
            position: relative;
            width: 60%;
            margin-bottom: 35vh;
            z-index: 2000;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--paper);
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            min-height:30vh;
            max-height: 30vh;
            overflow-y: auto;
            z-index: 2500;
            margin-top: 8px;
            list-style: none;
            border: 1px solid #e0e6e9;
        }

        .search-results li {
            padding: 1vmin 1.25vmin;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid #f0f0f0;
            font-size: var(--fs-sage-list);
            position: relative;
            padding-left: 1.5vmin;
        }

        .search-results li:hover {
            background: linear-gradient(90deg, rgba(74, 105, 189, 0.08) 0%, transparent 100%);
            padding-left: 2vmin;
            color: #4a69bd;
        }

        .search-results li:last-child {
            border-bottom: none;
        }

.panel {
    justify-items: center;
    padding:2vmin;
}

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50vw;
            width: 100%;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .info-card {
            background: var(--paper);
            border-radius: 20px;
            padding: 2vmin;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            min-height: 10%;
            font-size: 3vmin;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            width:22vw
        }

        .info-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border-color: rgba(74, 105, 189, 0.3);
        }

        h3 {
            font-size: 4vmin;
            margin-bottom: 1vmin;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
        }


        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .info-card ul {
            list-style: none;
        }

        .info-card li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            padding-left: 10px;
        }

        .info-card li:hover {
            color: #4a69bd;
            padding-left: 20px;
            background: linear-gradient(90deg, rgba(74, 105, 189, 0.1) 0%, transparent 100%);
        }

        .info-card li:last-child {
            border-bottom: none;
        }

        .date-selection-card {
            /* background: var(--paper);
            border-radius: 20px;
            padding: 2vmin;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); */
            width: 60%;
            justify-content: center;
            text-align: center;
            /* border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease; */
        }

        /* .date-selection-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        } */

        .dropdown-container {
            display: flex;

        }

        .select-group {
            flex: 1;
            
        }

        select {
            width: fit-content;
            
            padding: 2vmin;
            border: 2px solid #e0e6e9;
            border-radius: 12px;
            font-size: var(--fs-sage-list);
            font-weight: 500;
            background: var(--paper);
            transition: all 0.3s ease;
            outline: none;
            cursor: pointer;
        }

        select:hover {
            border-color: #b0bec5;
            transform: translateY(-1px);
        }

        select:focus {
            border-color: #4a69bd;
            box-shadow: 0 0 0 3px rgba(74, 105, 189, 0.1);
            transform: translateY(-2px);
        }

        .action-buttons{
            display: flex;
            position: fixed;
            top: 2vmin;
            left: 2vmin;
            z-index: 2000;
            flex-direction: column;
            gap: 1vh
        }

        .action-button {
            width: 7vmin;
            height: 7vmin;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            font-size: 4vmin;
            cursor: pointer;
            transition: all 0.3s ease;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .action-button:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
            background: var(--paper);
        }

        .action-button:active {
            transform: translateY(-1px) scale(1.05);
        }

        .alert-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--paper);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
            z-index: 200000;
            animation: popIn 0.3s ease-out;
            display: none;
        }

        li {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.6s forwards;
            }
            li:nth-child(1) { animation-delay: 0.34s; }
            li:nth-child(2) { animation-delay: 0.38s; }
            li:nth-child(3) { animation-delay: 0.42s; }
            li:nth-child(4) { animation-delay: 0.46s; }
            li:nth-child(5) { animation-delay: 0.50s; }
            li:nth-child(6) { animation-delay: 0.54s; }
            li:nth-child(7) { animation-delay: 0.58s; }
            li:nth-child(8) { animation-delay: 0.62s; }
            li:nth-child(9) { animation-delay: 0.66s; }
            li:nth-child(10) { animation-delay: 0.70s; }
            li:nth-child(11) { animation-delay: 0.74s; }
            li:nth-child(12) { animation-delay: 0.78s; }
            li:nth-child(13) { animation-delay: 0.82s; }
            li:nth-child(14) { animation-delay: 0.86s; }
            /* etc. */

            @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .alert-box p {
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .alert-box button {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
            transition: color 0.2s ease;
        }

        .alert-box button:hover {
            color: #333;
        }

        @media (max-width: 768px) {

            .search-container{
                width: 80%;
            }
            .date-selection-card {
                width: 80%;
            }
            select{
                width: 100% !important
            }
            
        }

        @media (max-width: 480px) {

            .body{
                overflow-x: auto;

            }
            .dropdown-container{
                flex-direction: column;
                
            }
            .search-container{
                width: 90%;
            }
            .date-selection-card {
                width: 90%;
                
            }
            select{
                width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <div class="alert-box" id="customAlert">
        <p id="message"></p>
        <button id='exit-button' onclick="hideCustomAlert(restart=false)">×</button>
    </div>

    <div class="header-section">
        <div class="header">
            <h1><span class="emoji-icon">🔍</span> Discover</h1>
            <p class="subtitle">Search for sages by name, birthday or yahrtzeit</p>
            <button class="modern-button" id="home-button" onclick="window.location.href='index.html'">🏠</button>
            <button class="modern-button" id="info-button">ℹ️</button>
            <button class="modern-button second-right-button" id="feedback-button" 
            onclick="window.location.href='feedback.html'">📩</button>
        </div>
    </div>
    <div class="container-grid">
        <div class="left-container">
            <div class="panel">
                <h3 class="panel-heading" id="birthdays-list-heading" style="justify-self: center;"> Birthdays</h3>
                <ul id="birthdays-list-content">
                </ul>
            </div>
        </div>
        <div class="central-container">
            <div class="search-container" id="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="🔍 Search for a sage...">
                <ul class="search-results" id="search-results"></ul>
            </div>   

            <div class="panel date-selection-card" id="date-selection-card">
                <h3 class="panel-heading" style="justify-self: center;">📅 Date Selection</h3>
                <div class="dropdown-container">
                    <div class="select-group">
                        <select id="day" name="day"></select>
                    </div>
                    
                    <div class="select-group">
                        <select id="month" name="month">
                            <option value="1">Nissan</option>
                 
                            <option value="2">Iyar</option>
                            <option value="3">Sivan</option>
                            <option value="4">Tammuz</option>
                            <option value="5">Av</option>
                            <option value="6">Elul</option>
                            <option value="7">Tishrei</option>
                            <option value="8">Cheshvan</option>
                            <option value="9">Kislev</option>
                            <option value="10">Teves</option>
                            <option value="11">Shevat</option>
                            <option value="12">Adar</option>
                            <option value="13">Adar II</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="right-container">
            <div class="panel">
                <h3 class="panel-heading"id="yahrtzeits-list-heading" style="justify-self: center;"> Yahrtzeits</h3>
                <ul id="yahrtzeits-list-content">
                </ul>
            </div>
        </div>
    </div>
    <script src="global.js"></script>
    <script type="module" src="discover_select.js"></script>
</body>
</html>
