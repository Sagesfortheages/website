<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Results</title>

  <link rel="stylesheet" href="all_styles.css" />

  <style>
    body{
      overflow:hidden;
    }

    .results-wrap{
      min-height:calc(100vh - var(--header-height) - 2vh);
      display:flex;
      justify-content:center;
      padding:2.5vh 2vw;
    }

    .results-card{
      width:min(1100px,94vw);
      max-height:78vh;
      overflow-y:auto;
      background:var(--paper-strong);
      border:1px solid var(--rule);
      border-radius:var(--radius);
      box-shadow:var(--shadow-soft);
      padding:2vmin;
      position:relative;
    }

    .results-head{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:1.2vmin;
      margin-bottom:1rem;
    }

    .results-head .rule{
      height:1px;
      background:rgba(110,85,55,0.30);
    }

    .results-head h2{
      font-family:var(--font-ui);
      color:var(--heading-ink);
      font-size:clamp(16px,2.6vmin,23px);
      text-transform:uppercase;
      letter-spacing:.06em;
      text-align:center;
      white-space:nowrap;
    }

    .results-intro{
      text-align:center;
      font-family:var(--font-display);
      font-size:clamp(18px,2.7vmin,25px);
      color:var(--ink-soft);
      font-style:italic;
      margin-bottom:1.2rem;
    }

    .control-grid{
      display:grid;
      grid-template-columns:1fr 1fr auto;
      gap:1rem;
      align-items:end;
      background:rgba(255,255,255,.38);
      border:1px solid var(--rule-faint);
      border-radius:var(--radius-sm);
      padding:1.1rem;
      box-shadow:inset 0 1px 6px rgba(0,0,0,.04);
      margin-bottom:1.1rem;
    }

    .field-label{
      display:block;
      font-family:var(--font-ui);
      color:var(--heading-ink);
      font-size:clamp(12px,1.8vmin,15px);
      letter-spacing:.05em;
      text-transform:uppercase;
      margin-bottom:.35rem;
      font-weight:700;
    }

    .select-input,
    .text-input{
      width:100%;
      padding:.75rem 1rem;
      font-family:var(--font-body);
      font-size:clamp(15px,2.2vmin,18px);
      color:var(--input-ink);
      background:rgba(255,255,255,.75);
      border:1px solid rgba(139,115,85,.35);
      border-radius:var(--radius-sm);
      box-shadow:inset 0 1px 6px rgba(0,0,0,.06);
      transition:border-color .15s ease, box-shadow .15s ease, background .15s ease, transform .15s ease;
    }

    .select-input:hover,
    .text-input:hover{
      background:rgba(255,255,255,.85);
    }

    .select-input:focus,
    .text-input:focus{
      outline:none;
      border-color:rgba(106,47,82,.45);
      box-shadow:inset 0 1px 6px rgba(0,0,0,.08), 0 0 0 3px rgba(106,47,82,.12);
      transform:translateY(-1px);
    }

    .select-input:disabled{
      opacity:.65;
      transform:none;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:.8rem;
      margin-bottom:1.1rem;
    }

    .summary-card{
      text-align:center;
      background:rgba(255,255,255,.38);
      border:1px solid var(--rule-faint);
      border-radius:var(--radius-sm);
      padding:.9rem;
      box-shadow:inset 0 1px 6px rgba(0,0,0,.04);
    }

    .summary-label{
      font-family:var(--font-ui);
      color:var(--heading-ink);
      font-size:clamp(11px,1.65vmin,14px);
      letter-spacing:.05em;
      text-transform:uppercase;
      margin-bottom:.3rem;
    }

    .summary-value{
      font-family:var(--font-display);
      color:var(--title-ink);
      font-size:clamp(24px,4vmin,38px);
      line-height:1;
    }

    .table-tools{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:1rem;
      margin-bottom:.8rem;
    }

    .student-search-wrap{
      width:min(380px,100%);
    }

    .results-table-wrap{
      overflow-x:auto;
      background:rgba(255,255,255,.30);
      border:1px solid var(--rule-faint);
      border-radius:var(--radius-sm);
      box-shadow:inset 0 1px 6px rgba(0,0,0,.04);
    }

    .results-table{
      width:100%;
      min-width:760px;
      border-collapse:collapse;
    }

    .results-table th,
    .results-table td{
      padding:.8rem .9rem;
      border-bottom:1px solid var(--rule-faint);
      text-align:left;
      vertical-align:middle;
    }

    .results-table th{
      font-family:var(--font-ui);
      color:var(--heading-ink);
      font-size:clamp(11px,1.65vmin,14px);
      letter-spacing:.05em;
      text-transform:uppercase;
      background:rgba(245,230,211,.72);
      cursor:pointer;
      white-space:nowrap;
    }

    .results-table tr:last-child td{
      border-bottom:none;
    }

    .results-table tbody tr{
      transition:background .15s ease, transform .12s ease;
    }

    .results-table tbody tr:hover{
      background:rgba(255,255,255,.42);
    }

    .student-name{
      font-family:var(--font-display);
      color:var(--title-ink);
      font-size:clamp(17px,2.35vmin,21px);
      font-weight:600;
    }

    .muted{
      color:var(--ink-soft);
      opacity:.82;
      font-style:italic;
    }

    .score-pill,
    .status-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:4.8rem;
      padding:.35rem .65rem;
      border-radius:99px;
      border:1px solid var(--rule-faint);
      font-family:var(--font-ui);
      font-size:clamp(12px,1.8vmin,15px);
      font-weight:700;
      letter-spacing:.03em;
      background:rgba(255,255,255,.55);
      color:var(--heading-ink);
    }

    .status-complete{
      color:rgba(47,79,79,.98);
      background:rgba(47,79,79,.12);
      border-color:rgba(47,79,79,.28);
    }

    .status-open{
      color:rgba(140,40,40,.95);
      background:rgba(140,40,40,.10);
      border-color:rgba(140,40,40,.24);
    }

    .score-good{
      color:rgba(47,79,79,.98);
      background:rgba(47,79,79,.14);
      border-color:rgba(47,79,79,.30);
    }

    .score-review{
      color:rgba(140,40,40,.95);
      background:rgba(140,40,40,.12);
      border-color:rgba(140,40,40,.24);
    }

    .progress-line-small{
      width:150px;
      max-width:100%;
      height:10px;
      background:var(--rule-faint);
      border-radius:99px;
      overflow:hidden;
      margin-top:.25rem;
    }

    .progress-fill-small{
      width:0%;
      height:100%;
      background:var(--accent);
      transition:width .35s ease;
    }

    .message-row{
      text-align:center !important;
      padding:2rem !important;
      font-family:var(--font-display);
      color:var(--ink-soft);
      font-size:clamp(18px,2.5vmin,24px);
      font-style:italic;
    }

    .error-row{
      color:rgba(140,40,40,.95);
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:1rem;
      flex-wrap:wrap;
    }

    .mini-button{
      min-height:auto;
      min-width:auto;
      padding:.8rem 1.1rem;
      font-size:clamp(12px,1.7vmin,15px);
    }

    @media(max-width:800px){
      .control-grid{
        grid-template-columns:1fr;
      }

      .summary-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .table-tools{
        flex-direction:column;
        align-items:stretch;
      }

      .student-search-wrap{
        width:100%;
      }
    }

    @media(max-width:700px){
      .results-wrap{padding:1.5vh 3vw;}
      .results-card{max-height:82vh;padding:1rem;}
      .results-head h2{white-space:normal;}
      .summary-grid{grid-template-columns:1fr;}
      .control-grid .cta-button,
      .table-tools .cta-button{width:100%;}
    }
  </style>
</head>

<body>
  <div class="header-section">
    <div class="header">
      <h1>
        <span class="emoji">📜</span>
        <span class="gradient-text">Assignment Results</span>
      </h1>
      <p class="subtitle">Review each student’s challenge progress.</p>
      <button class="modern-button" id="home-button" onclick="window.location.href='teacher_home.html'">🏠</button>
    </div>
  </div>

  <main class="results-wrap">
    <section class="results-card">
      <div class="results-head">
        <div class="rule"></div>
        <h2 id="results-title">Teacher Dashboard</h2>
        <div class="rule"></div>
      </div>

      <p class="results-intro" id="teacher-line">Choose a class and assignment.</p>

      <section class="control-grid">
        <div>
          <label class="field-label" for="class-select">Class</label>
          <select class="select-input" id="class-select">
            <option value="">Loading classes...</option>
          </select>
        </div>

        <div>
          <label class="field-label" for="assignment-select">Assignment</label>
          <select class="select-input" id="assignment-select" disabled>
            <option value="">Select a class first...</option>
          </select>
        </div>

        <button type="button" class="cta-button sweep" id="load-results-button" disabled>Load Results</button>
      </section>

      <section class="summary-grid" aria-label="Assignment summary">
        <article class="summary-card">
          <div class="summary-label">Students</div>
          <div class="summary-value" id="stat-students">—</div>
        </article>

        <article class="summary-card">
          <div class="summary-label">Completed</div>
          <div class="summary-value" id="stat-completed">—</div>
        </article>

        <article class="summary-card">
          <div class="summary-label">Average Score</div>
          <div class="summary-value" id="stat-average">—</div>
        </article>

        <article class="summary-card">
          <div class="summary-label">Open</div>
          <div class="summary-value" id="stat-open">—</div>
        </article>
      </section>

      <div class="table-tools">
        <div class="student-search-wrap">
          <label class="field-label" for="student-search">Search Students</label>
          <input class="text-input" id="student-search" type="search" placeholder="Type a student name..." />
        </div>

        <div class="actions">
          <button type="button" class="cta-button mini-button" id="export-csv-button" disabled>Export CSV</button>
        </div>
      </div>

      <div class="results-table-wrap">
        <table class="results-table">
          <thead>
            <tr>
              <th data-sort="student_name">Student</th>
              <th data-sort="game_completed">Status</th>
              <th data-sort="game_score">Game Score</th>
              <th data-sort="assignment_id">Assignment</th>
              <th data-sort="created_at">Submitted</th>
            </tr>
          </thead>
          <tbody id="results-body">
            <tr>
              <td colspan="5" class="message-row">Choose a class and assignment to begin.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module">
    import { supabaseClient } from './supabase/supabaseClient.js';

    const classSelect = document.getElementById('class-select');
    const assignmentSelect = document.getElementById('assignment-select');
    const loadResultsButton = document.getElementById('load-results-button');
    const resultsBody = document.getElementById('results-body');
    const studentSearch = document.getElementById('student-search');
    const exportCsvButton = document.getElementById('export-csv-button');
    const teacherLine = document.getElementById('teacher-line');
    const resultsTitle = document.getElementById('results-title');

    const statStudents = document.getElementById('stat-students');
    const statCompleted = document.getElementById('stat-completed');
    const statAverage = document.getElementById('stat-average');
    const statOpen = document.getElementById('stat-open');

    let teacherProfile = null;
    let currentRows = [];
    let sortKey = 'student_name';
    let sortDirection = 'asc';

    document.addEventListener('DOMContentLoaded', init);
    classSelect.addEventListener('change', handleClassChange);
    assignmentSelect.addEventListener('change', updateLoadButtonState);
    loadResultsButton.addEventListener('click', loadResults);
    studentSearch.addEventListener('input', renderRows);
    exportCsvButton.addEventListener('click', exportCsv);

    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const nextKey = th.dataset.sort;

        if (sortKey === nextKey) {
          sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = nextKey;
          sortDirection = 'asc';
        }

        renderRows();
      });
    });

    async function init(){
      try{
        setMessage('Loading teacher account...');

        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
        if (userError) throw userError;

        if (!user) {
          setError('Please sign in as a teacher to view assignment results.');
          teacherLine.textContent = 'Not signed in.';
          return;
        }

        const { data: profile, error: profileError } = await supabaseClient
          .from('profiles')
          .select('id, display_name, role')
          .eq('auth_user_id', user.id)
          .single();

        if (profileError) throw profileError;
        teacherProfile = profile;

        if (teacherProfile.role && teacherProfile.role !== 'teacher') {
          throw new Error('This page is only available for teacher accounts.');
        }

        teacherLine.textContent = teacherProfile.display_name
          ? `Welcome, ${teacherProfile.display_name}.`
          : 'Welcome. Choose a class and assignment.';

        await loadClasses();
        resetStats();
      } catch(err) {
        console.error(err);
        setError(err.message || 'Could not load this page.');
      }
    }

    async function loadClasses(){
      const { data: classes, error } = await supabaseClient
        .from('classes')
        .select('id, class_name')
        .eq('teacher_profile_id', teacherProfile.id)
        .order('class_name', { ascending:true });

      if (error) throw error;

      if (!classes?.length) {
        classSelect.innerHTML = '<option value="">No classes found</option>';
        assignmentSelect.innerHTML = '<option value="">No assignments available</option>';
        setMessage('No classes were found for this teacher account.');
        return;
      }

      classSelect.innerHTML = '<option value="">Select class...</option>';

      classes.forEach(c => {
        const option = document.createElement('option');
        option.value = c.id;
        option.textContent = c.class_name;
        classSelect.appendChild(option);
      });

      setMessage('Choose a class and assignment to begin.');
    }

    async function handleClassChange(){
      const classId = classSelect.value;

      currentRows = [];
      renderRows();
      resetStats();
      exportCsvButton.disabled = true;
      assignmentSelect.disabled = true;
      loadResultsButton.disabled = true;

      if (!classId) {
        assignmentSelect.innerHTML = '<option value="">Select a class first...</option>';
        setMessage('Choose a class and assignment to begin.');
        return;
      }

      try{
        setMessage('Loading assignments...');
        assignmentSelect.innerHTML = '<option value="">Loading assignments...</option>';

        const { data: assignments, error } = await supabaseClient
          .from('assignments')
          .select('id, title, target_sage_person')
          .eq('class_id', classId)
          .order('title', { ascending:true });

        if (error) throw error;

        if (!assignments?.length) {
          assignmentSelect.innerHTML = '<option value="">No assignments found</option>';
          setMessage('No assignments were found for this class.');
          return;
        }

        assignmentSelect.innerHTML = '<option value="">Select assignment...</option>';

        assignments.forEach(a => {
          const option = document.createElement('option');
          option.value = a.id;

          const baseTitle = a.title || "Mystery Sage";

          option.textContent = a.target_sage_person
            ? `${baseTitle} – ${a.target_sage_person}`
            : baseTitle;

          assignmentSelect.appendChild(option);
        });

        assignmentSelect.disabled = false;
        setMessage('Now choose an assignment.');
      } catch(err) {
        console.error(err);
        setError(err.message || 'Could not load assignments.');
      }
    }

    function updateLoadButtonState(){
      loadResultsButton.disabled = !classSelect.value || !assignmentSelect.value;
    }

    async function loadResults(){
      const classId = classSelect.value;
      const assignmentId = assignmentSelect.value;
      if (!classId || !assignmentId) return;

      try{
        loadResultsButton.disabled = true;
        setMessage('Loading student results...');

        const students = await getStudentsForClass(classId);
        const progressRows = await getProgressForAssignment(assignmentId);

        const progressByStudentId = new Map();

        progressRows.forEach(row => {
          const current = progressByStudentId.get(row.student_id);

          if (!current || dateValue(row.created_at) > dateValue(current.created_at)) {
            progressByStudentId.set(row.student_id, row);
          }
        });

        currentRows = students.map(student => {
          const progress = progressByStudentId.get(student.id);

          return {
            student_id: student.id,
            student_name: student.display_name || student.name || 'Unnamed Student',
            assignment_id: assignmentId,
            game_score: progress?.game_score ?? null,
            game_completed: Boolean(progress?.game_completed),
            created_at: progress?.created_at || null
          };
        });

        const selectedAssignmentText = assignmentSelect.options[assignmentSelect.selectedIndex]?.textContent || 'Assignment';
        resultsTitle.textContent = selectedAssignmentText;

        renderStats(currentRows);
        renderRows();
        exportCsvButton.disabled = currentRows.length === 0;
      } catch(err) {
        console.error(err);
        setError(err.message || 'Could not load results.');
      } finally {
        updateLoadButtonState();
      }
    }

async function getStudentsForClass(classId){
  const { data, error } = await supabaseClient
    .from('students')
    .select(`
      id,
      username,
      placeholder_email,
      profile_id,
      profile:profile_id (
        display_name
      )
    `)
    .eq('class_id', classId)
    .eq('active', true);

  if (error) throw error;

  return (data || [])
    .map(student => ({
      id: student.id,
      display_name:
        student.profile?.display_name ||
        student.username ||
        student.placeholder_email ||
        'Unnamed Student'
    }))
    .sort((a, b) => a.display_name.localeCompare(b.display_name));
}

    async function getProgressForAssignment(assignmentId){
      const { data, error } = await supabaseClient
        .from('assignment_progress')
        .select('assignment_id, student_id, game_score, game_completed, created_at')
        .eq('assignment_id', assignmentId);

      if (error) throw error;
      return data || [];
    }

    function renderStats(rows){
      const total = rows.length;
      const completed = rows.filter(row => row.game_completed).length;
      const open = total - completed;
      const scored = rows.filter(row => typeof row.game_score === 'number');
      const average = scored.length
        ? Math.round(scored.reduce((sum, row) => sum + row.game_score, 0) / scored.length)
        : null;

      statStudents.textContent = total;
      statCompleted.textContent = completed;
      statAverage.textContent = average === null ? '—' : average;
      statOpen.textContent = open;
    }

    function resetStats(){
      statStudents.textContent = '—';
      statCompleted.textContent = '—';
      statAverage.textContent = '—';
      statOpen.textContent = '—';
    }

    function renderRows(){
      const search = studentSearch.value.trim().toLowerCase();
      let rows = [...currentRows];

      if (search) {
        rows = rows.filter(row => row.student_name.toLowerCase().includes(search));
      }

      rows.sort((a, b) => compareRows(a, b, sortKey, sortDirection));

      if (!rows.length) {
        resultsBody.innerHTML = `
          <tr>
            <td colspan="5" class="message-row">
              ${currentRows.length ? 'No students match your search.' : 'Choose a class and assignment to begin.'}
            </td>
          </tr>
        `;
        return;
      }

      resultsBody.innerHTML = rows.map(row => `
        <tr>
          <td>
            <div class="student-name">${escapeHtml(row.student_name)}</div>
            <div class="muted">Student ID: ${escapeHtml(row.student_id)}</div>
          </td>
          <td>${formatCompletion(row.game_completed)}</td>
          <td>${formatScore(row.game_score)}</td>
          <td><span class="muted">${escapeHtml(row.assignment_id)}</span></td>
          <td>${row.created_at ? formatDate(row.created_at) : '<span class="muted">Not submitted</span>'}</td>
        </tr>
      `).join('');
    }

    function compareRows(a, b, key, direction){
      const dir = direction === 'asc' ? 1 : -1;
      const av = a[key];
      const bv = b[key];

      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;

      if (typeof av === 'number' && typeof bv === 'number') {
        return (av - bv) * dir;
      }

      if (typeof av === 'boolean' && typeof bv === 'boolean') {
        return (Number(av) - Number(bv)) * dir;
      }

      return String(av).localeCompare(String(bv)) * dir;
    }

    function formatCompletion(completed){
      return completed
        ? '<span class="status-pill status-complete">Complete</span>'
        : '<span class="status-pill status-open">Open</span>';
    }

    function formatScore(score){
      if (typeof score !== 'number') {
        return '<span class="muted">—</span>';
      }

      const className = score >= 8 ? 'score-good' : 'score-review';

      return `
        <span class="score-pill ${className}">${score}</span>
        <div class="progress-line-small" aria-hidden="true">
          <div class="progress-fill-small" style="width:${Math.min(100, Math.round((score / 12) * 100))}%"></div>
        </div>
      `;
    }

    function formatDate(value){
      return new Intl.DateTimeFormat(undefined, {
        month:'short',
        day:'numeric',
        year:'numeric',
        hour:'numeric',
        minute:'2-digit'
      }).format(new Date(value));
    }

    function dateValue(value){
      return value ? new Date(value).getTime() : 0;
    }

    function setMessage(message){
      resultsBody.innerHTML = `
        <tr>
          <td colspan="5" class="message-row">${escapeHtml(message)}</td>
        </tr>
      `;
    }

    function setError(message){
      resultsBody.innerHTML = `
        <tr>
          <td colspan="5" class="message-row error-row">${escapeHtml(message)}</td>
        </tr>
      `;
    }

    function exportCsv(){
      if (!currentRows.length) return;

      const headers = ['Student', 'Student ID', 'Completed', 'Game Score', 'Assignment ID', 'Submitted At'];
      const rows = currentRows.map(row => [
        row.student_name,
        row.student_id,
        row.game_completed ? 'Complete' : 'Open',
        row.game_score ?? '',
        row.assignment_id,
        row.created_at ?? ''
      ]);

      const csv = [headers, ...rows]
        .map(row => row.map(csvEscape).join(','))
        .join('\n');

      const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'assignment-results.csv';
      link.click();
      URL.revokeObjectURL(url);
    }

    function csvEscape(value){
      const str = String(value ?? '');
      return `"${str.replaceAll('"', '""')}"`;
    }

    function escapeHtml(value){
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
</body>
