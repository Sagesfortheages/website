<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Select</title>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />

    <link rel="icon" href="icon3.png" type="image/x-icon">
    <link rel="shortcut icon" href="icon3.png" type="image/x-icon">
    <link rel="stylesheet" href="all_styles.css">
    <script src="global.js"></script>

    <style>
        /* Page-specific tweaks; tiles, grid, alerts come from all_styles.css */

        /* -------- MOBILE -------- */
        @media (max-width: 600px) {
          body {
            overflow-y: auto;
          }

          .page {
            padding: 2vh 4vw 4vh;
          }

          .header {
            margin-bottom: 2vh;
          }

          .header h1 {
            font-size: 6.5vmin;
            text-align: center;
          }

          .subtitle {
            font-size: 3.2vmin;
            line-height: 1.35;
            text-align: center;
            margin: 1vh 0 2vh;
            padding: 0 2vw;
          }

          .grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 3.5vmin;
            width: 100%;
          }

          .tile {
            min-height: 18vh;
            padding: 2.5vmin;
          }

          .tile-icon {
            font-size: 7.5vmin;
            margin-bottom: 1vmin;
          }

          .tile-label {
            font-size: 3.6vmin;
            line-height: 1.25;
          }

          .alert-box {
            width: 88vw;
            padding: 3vh 5vw;
          }
        }
    </style>
</head>
<body>

    <div class="alert-box" id="customAlert">
        <p id="message"></p>
        <button id="exit-button" onclick="hideCustomAlert(restart=false)">x</button>
    </div>

    <div class="page">

        <div class="header">
            <h1>
                <span class="emoji">📜</span>
                <span class="gradient-text">Study</span>
            </h1>
            <p class="subtitle">Engage with classic texts like never before. Discover the people behind the words.</p>

            <button class="modern-button" id="home-button" onclick="window.location.href='index.html'">
                🏠
            </button>

            <button class="modern-button" id="info-button"
                onclick="showCustomAlert(`Select a foundational text, to get a guide to the commentaries available on a typical page.`, restart=false)">
                ℹ️
            </button>

            <button class="modern-button second-right-button" id="feedback-button"
                onclick="window.location.href='feedback.html'">
                📩
            </button>
        </div>

        <div class="grid">

            <button class="tile" onclick="window.location.href='texts/mikraos_gedolos.html'">
                <div class="tile-icon">📒</div>
                <div class="tile-label">Mikraos Gedolos</div>
            </button>

            <button class="tile coming">
                <div class="tile-icon">📔</div>
                <div class="tile-label">Mishna</div>
            </button>

            <button class="tile coming">
                <div class="tile-icon">📕</div>
                <div class="tile-label">Medrash</div>
            </button>

            <button class="tile coming">
                <div class="tile-icon">📗</div>
                <div class="tile-label">Gemara</div>
            </button>

            <button class="tile coming">
                <div class="tile-icon">📒</div>
                <div class="tile-label">Talmud Yerushalmi</div>
            </button>

            <button class="tile" onclick="window.location.href='texts/frankel_rambam.html'">
                <div class="tile-icon">📘</div>
                <div class="tile-label">Rambam</div>
            </button>

            <button class="tile coming">
                <div class="tile-icon">📕</div>
                <div class="tile-label">Tur</div>
            </button>

            <button class="tile" onclick="window.location.href='texts/shulchan_aruch.html'">
                <div class="tile-icon">📔</div>
                <div class="tile-label">Shulchan Aruch</div>
            </button>

        </div>
    </div>

    <script src="global.js"></script>
    <script type="module">
        import { trackPageView } from './supabase/supabaseFunctions.js';
        trackPageView();
    </script>

</body>
</html>
