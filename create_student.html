<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Tools</title>
</head>
<body>
  <h1>Teacher Tools</h1>

  <div>
    <label>Class ID</label>
    <input id="class-id" type="number" />
  </div>

  <div>
    <label>Student Display Name</label>
    <input id="student-name" type="text" />
  </div>

  <div>
    <label>Student Username</label>
    <input id="student-username" type="text" />
  </div>

  <button type="button" id="create-student-btn">Create Student</button>

  <pre id="result"></pre>

  <script type="module" src="teacher_tools.js"></script>
</body>
</html>
