<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon3.png" type="image/x-icon">
<link rel="shortcut icon" href="icon3.png" type="image/x-icon">
<link rel="stylesheet" href="all_styles.css">
<title>Feedback</title>

<style>
/* =========================================
   FEEDBACK PAGE — PARCHMENT THEME
   Uses your existing :root tokens
   Drop-in replacement for your old <style> block
   ========================================= */

*{ margin:0; padding:0; box-sizing:border-box; font-family: var(--font-body); }

body{
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4vmin;

  /* match site */
  color: var(--ink);
}

/* Card becomes a parchment panel */
.feedback-card{
  position: relative;
  width: min(70vmin, 95vw);
  padding: 4vmin;
  border-radius: calc(var(--radius) + 6px);

  background: linear-gradient(
    135deg,
    rgba(255, 248, 230, 0.96),
    rgba(245, 230, 211, 0.92)
  );

  border: 1px solid var(--rule-strong);
  box-shadow:
    0 14px 30px rgba(0,0,0,0.20),
    inset 0 1px 0 rgba(255,255,255,0.55);

  animation: fadeIn 0.45s ease;
  overflow: hidden;
}

/* subtle texture wash like your panels */
.feedback-card::after{
  content:"";
  position:absolute;
  inset:0;
  background-image: var(--page-texture);
  background-size: cover;
  background-position: center;
  opacity: 0.10;
  pointer-events:none;
}

/* inner rule frame */
.feedback-card::before{
  content:"";
  position:absolute;
  inset: 1.2vmin;
  border-radius: calc(var(--radius) + 2px);
  border: 1px solid var(--rule-faint);
  pointer-events:none;
  opacity: 0.9;
}

/* Title styling = your header vibe */
h1{
  position: relative;
  z-index: 1;
  font-family: var(--font-display);
  font-size: clamp(26px, 5vmin, 44px);
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--title-ink);
  text-shadow: 1px 1px 2px rgba(0,0,0,0.14);
  text-align: center;
  margin-bottom: 2.4vmin;
}

/* optional small subtitle line if you add one later */
.feedback-subtitle{
  position: relative;
  z-index: 1;
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(14px, 2.6vmin, 18px);
  color: var(--ink-soft);
  opacity: 0.8;
  text-align: center;
  margin-top: -1.2vmin;
  margin-bottom: 2.4vmin;
}

label{
  position: relative;
  z-index: 1;
  display: block;
  margin-top: 1.4vmin;
  margin-bottom: 0.8vmin;

  font-family: var(--font-ui);
  font-size: clamp(14px, 2.2vmin, 18px);
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--heading-ink);
  text-transform: uppercase;
}

/* Inputs match your search-input feel */
select,
textarea{
  position: relative;
  z-index: 1;

  width: 100%;
  padding: 1.2vmin 1.4vmin;

  border-radius: var(--radius-sm);
  border: 1px solid rgba(139,115,85,0.35);
  background: rgba(255,255,255,0.70);
  color: var(--input-ink);

  font-family: var(--font-body);
  font-size: clamp(14px, 2.2vmin, 18px);

  box-shadow: inset 0 1px 6px rgba(0,0,0,0.08);
  outline: none;
}

select:focus,
textarea:focus{
  border-color: rgba(47,79,79,0.45);
  box-shadow:
    inset 0 1px 6px rgba(0,0,0,0.08),
    0 0 0 3px rgba(47,79,79,0.18);
}

textarea{
  min-height: 18vmin;
  height: auto;
  resize: vertical; /* allow resizing without breaking layout */
  line-height: 1.45;
}

select::placeholder,
textarea::placeholder{
  color: #7a6a5a;
  font-style: italic;
}

/* Button becomes parchment CTA style */
.submit-btn{
  position: relative;
  z-index: 1;

  margin-top: 3vmin;
  width: 100%;
  padding: 1.6vmin 2vmin;

  font-family: var(--font-ui);
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: clamp(14px, 2.5vmin, 19px);

  color: var(--classy-blue-ink);
  background: linear-gradient(
    to bottom,
    rgba(255, 252, 244, 0.96),
    rgba(245, 230, 211, 0.92)
  );

  border: 1px solid var(--rule-strong);
  border-radius: calc(var(--radius) + 4px);

  box-shadow:
    0 10px 22px rgba(0,0,0,0.16),
    inset 0 1px 0 rgba(255,255,255,0.55);

  cursor: pointer;
  user-select: none;
  transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.18s ease;
}

.submit-btn::before{
  content:"";
  position:absolute;
  inset: 0.65vmin;
  border-radius: calc(var(--radius) + 2px);
  border: 1px solid rgba(110,85,55,0.22);
  background: rgba(47,79,79,0.06);
  pointer-events:none;
  opacity: 0.7;
}

.submit-btn:hover{
  transform: translateY(-2px);
  box-shadow:
    0 14px 30px rgba(0,0,0,0.20),
    inset 0 1px 0 rgba(255,255,255,0.65);
  filter: saturate(1.03);
}

.submit-btn:active{
  transform: translateY(0px);
  box-shadow:
    0 8px 16px rgba(0,0,0,0.16),
    inset 0 2px 10px rgba(0,0,0,0.10);
}

.submit-btn:focus-visible{
  outline: none;
  box-shadow:
    0 14px 30px rgba(0,0,0,0.20),
    0 0 0 3px rgba(3,43,125,0.22);
}

/* Status message matches ink palette */
.status{
  position: relative;
  z-index: 1;
  margin-top: 2vmin;
  font-size: clamp(13px, 2vmin, 16px);
  text-align: center;
  font-weight: 700;
  color: var(--ink-soft);
}

/* If you use success/error classes, they’ll look right */
.status.success{ color: var(--correct-color); }
.status.error{ color: var(--incorrect-color); }

@keyframes fadeIn{
  from{ opacity:0; transform: translateY(1vmin) scale(0.985); }
  to{ opacity:1; transform: translateY(0) scale(1); }
}

/* =========================================
   LOGIN OVERLAY — parchment modal
   ========================================= */

.overlay{
  position: fixed;
  inset: 0;
  background: rgba(47, 36, 27, 0.58); /* ink overlay */
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000000000;
}

.auth-modal{
  position: relative;
  width: min(52vmin, 92vw);
  padding: 3vmin;
  border-radius: calc(var(--radius) + 6px);

  background: linear-gradient(
    135deg,
    rgba(255, 248, 230, 0.97),
    rgba(245, 230, 211, 0.93)
  );

  border: 1px solid var(--rule-strong);
  box-shadow:
    0 18px 46px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.55);

  text-align: center;
  color: var(--ink);
  overflow: hidden;
}

.auth-modal::after{
  content:"";
  position:absolute;
  inset:0;
  background-image: var(--page-texture);
  background-size: cover;
  background-position: center;
  opacity: 0.08;
  pointer-events:none;
}

.auth-modal h2,
.auth-modal h3,
.auth-modal p{
  position: relative;
  z-index: 1;
}

.auth-modal button{
  position: relative;
  z-index: 1;

  margin-top: 2vmin;
  padding: 1.2vmin 2.2vmin;

  font-family: var(--font-ui);
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: clamp(13px, 2.2vmin, 16px);

  color: var(--classy-blue-ink);
  background: rgba(255, 248, 230, 0.92);

  border: 1px solid rgba(3,43,125,0.25);
  border-radius: var(--radius-sm);

  box-shadow: var(--shadow-tight);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.18s ease, background 0.18s ease;
}

.auth-modal button:hover{
  transform: translateY(-1px);
  box-shadow: var(--shadow-soft);
  background: rgba(255,255,255,0.90);
}

.auth-modal button:focus-visible{
  outline: none;
  box-shadow:
    var(--shadow-soft),
    0 0 0 3px rgba(3,43,125,0.22);
}

/* =========================================
   Mobile tweaks
   ========================================= */
@media (max-width: 700px){
  body{ padding: 6vmin 3.5vmin; }

  .feedback-card{
    width: 95vw;
    padding: 5vmin 4vmin;
  }

  textarea{ min-height: 22vmin; }
}
</style>

<script type="module">
import { supabaseClient } from './supabase/supabaseClient.js';
import { trackPageView } from './supabase/supabaseFunctions.js';
trackPageView(); // Track page view for analytics


async function checkAuth() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    if (!session || !session.user) {
        document.getElementById("overlay").style.display = "flex";
    } else {
        document.getElementById("overlay").style.display = "none";
    }
}

// Show overlay immediately if not logged in
checkAuth();

// Listen for auth changes
supabaseClient.auth.onAuthStateChange((event, session) => {
    if (!session?.user) {
        document.getElementById("overlay").style.display = "flex";
    } else {
        document.getElementById("overlay").style.display = "none";
    }
});

// Feedback submission
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("submit-feedback").addEventListener("click", async () => {
        const type = document.getElementById("feedback-type").value;
        const page = document.getElementById("related-page").value;
        const text = document.getElementById("feedback-text").value.trim();
        const status = document.getElementById("status");

        if (!text) {
            status.textContent = "Please enter feedback.";
            status.style.color = "red";
            return;
        }

        // Get current user
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
        if (sessionError || !session?.user) {
            status.textContent = "You must log in first.";
            status.style.color = "red";
            document.getElementById("overlay").style.display = "flex";
            return;
        }

        const userId = session.user.id;

        // Insert feedback
        const { error } = await supabaseClient.from("feedback").insert([
            { user_id: userId, feedback_type: type, related_page: page, message: text }
        ]);

        if (error) {
            status.textContent = "Error saving feedback.";
            status.style.color = "red";
            console.error(error);
        } else {
            status.textContent = "Feedback submitted. Thank you!";
            status.style.color = "green";
            document.getElementById("feedback-text").value = "";
        }
    });
});
</script>
</head>

<body>
<div id="overlay" class="overlay">
    <div class="auth-modal">
        <p style="font-size:2.5vmin; margin-bottom:1vmin;">Please log in to submit feedback.</p>
        <button onclick="window.location.href='index.html'">Go to Login</button>
    </div>
</div>

<div class="feedback-card">
    <h1>Send Feedback</h1>

    <p>Please tell us what's on your mind. Your feedback is very helpful, whether it's a thought on data accuracy or website design, 
        a bug that needs fixing or an idea for a new feature, we would love to hear your thoughts.</p>

    <label>Feedback Type</label>
    <select id="feedback-type">
        <option value="Issue">Issue</option>
        <option value="Enhancement">Enhancement</option>
        <option value="Comment">Comment</option>
        <option value="Other">Other</option>
    </select>

    <label>Related to Page</label>
    <select id="related-page">
        <option>Home</option>
        <option>Analyze</option>
        <option>Watch</option>
        <option>Discover</option>
        <option>Time</option>
        <option>Locate</option>
        <option>Delve</option>
        <option>Tour</option>
        <option>Study</option>
        <option>Journey</option>
        <option>Play</option>
        <option>Other</option>
    </select>

    <label>Your Feedback</label>
    <textarea id="feedback-text" placeholder="Write your comments..."></textarea>

    <button class="submit-btn" id="submit-feedback">Submit</button>
    <div id="status" class="status"></div>
</div>
</body>
</html>
